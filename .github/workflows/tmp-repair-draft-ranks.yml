name: Temporary Repair Draft Ranks

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'codex/fpl-review-20260802-1228-validate-ranks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1228-validate-ranks
          fetch-depth: 0
      - run: |
          git show d3d4002a8a19bfb7b7c7c09f6498b6f580724a6b:'vault/01 Current/Current Draft Board.md' > /tmp/baseline-board.md
          python - <<'PY'
          from pathlib import Path

          def parse_rows(text: str):
              rows = []
              for line in text.splitlines():
                  if not line.startswith('| '):
                      continue
                  cells = [cell.strip() for cell in line.strip('|').split('|')]
                  if len(cells) < 7 or not cells[0].isdigit():
                      continue
                  rows.append({'rank': int(cells[0]), 'id': int(cells[6]), 'cells': cells})
              return rows

          path = Path('vault/01 Current/Current Draft Board.md')
          lines = path.read_text(encoding='utf-8').splitlines()
          current = parse_rows('\n'.join(lines))
          baseline = parse_rows(Path('/tmp/baseline-board.md').read_text(encoding='utf-8'))

          current_ids = {row['id'] for row in current}
          missing_ids = [row for row in baseline if row['id'] not in current_ids]
          missing_ranks = [rank for rank in range(1, 351) if rank not in {row['rank'] for row in current}]

          if len(missing_ids) != len(missing_ranks):
              raise SystemExit(f'Cannot reconcile missing IDs {missing_ids} with ranks {missing_ranks}')

          assignments = []
          remaining_ranks = set(missing_ranks)
          remaining_rows = list(missing_ids)

          # Preserve original ranks where both the player and rank are missing.
          for row in list(remaining_rows):
              if row['rank'] in remaining_ranks:
                  assignments.append((row, row['rank']))
                  remaining_rows.remove(row)
                  remaining_ranks.remove(row['rank'])

          # Any player displaced by a later promotion fills the remaining open rank.
          for row, rank in zip(remaining_rows, sorted(remaining_ranks), strict=True):
              assignments.append((row, rank))

          for row, rank in sorted(assignments, key=lambda item: item[1]):
              cells = list(row['cells'])
              cells[0] = str(rank)
              if rank >= 221:
                  cells[4] = 'Extended watch buffer'
                  cells[5] = 'Watch'
              rendered = '| ' + ' | '.join(cells) + ' |'
              insert_at = next(i for i, line in enumerate(lines) if line.startswith(f'| {rank + 1} |'))
              lines.insert(insert_at, rendered)
              print(f"restored FPL ID {row['id']} ({cells[1]}) at rank {rank}")

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python scripts/validate_draft_board.py
          rm -f .tmp/repair-ranks-trigger.txt .tmp/repair-ranks-trigger-2.txt .tmp/repair-ranks-trigger-3.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore missing draft board ranks"
          git push origin HEAD:codex/fpl-review-20260802-1228-validate-ranks
