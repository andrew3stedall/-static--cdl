name: Temporary sync unranked top140 branch
on:
  push:
    paths:
      - .github/workflows/tmp-sync-unranked-top140.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1009-unranked-top140-screen
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main -s ours -m "Sync unranked top-140 review with current main"
          git push origin HEAD:codex/fpl-review-20260802-1009-unranked-top140-screen
