name: Run top-16 pairwise review once

on:
  push:
    branches:
      - codex/fpl-review-20260801-2207-top16-pairwise
    paths:
      - '.github/workflows/run-top16-pairwise-once.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260801-2207-top16-pairwise
          fetch-depth: 0
      - name: Generate review files
        run: python scripts/run_top16_pairwise_once.py
      - name: Commit generated review
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- 'vault/00 Meta/Document Changelog.md' 'vault/01 Current/Current Draft Board.md' 'vault/01 Current/Current Watchlist.md' 'vault/02 Players' 'vault/06 Reviews/2026/08/2026-08-01/2207-AEST-review.md' 'vault/07 Changes/2026/08/2026-08-01/2207-AEST-changes.md' 'vault/Home.md' 'vault/Wiki.md' scripts/run_top16_pairwise_once.py .github/workflows/run-top16-pairwise-once.yml
          git commit -m 'Complete top-16 pairwise FPL review'
          git push origin HEAD:codex/fpl-review-20260801-2207-top16-pairwise
