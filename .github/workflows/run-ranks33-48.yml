name: One-off ranks 33-48 pairwise review
on:
  push:
    branches:
      - codex/fpl-review-20260801-2254-ranks33-48
    paths:
      - '.github/workflows/run-ranks33-48.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260801-2254-ranks33-48
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_ranks33_48_pairwise.py
      - run: |
          rm scripts/apply_ranks33_48_pairwise.py
          rm .github/workflows/run-ranks33-48.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Pairwise-sort FPL Draft ranks 33-48"
          git push
