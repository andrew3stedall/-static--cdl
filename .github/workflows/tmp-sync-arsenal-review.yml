name: Temporary Sync Arsenal Review

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'codex/fpl-review-20260802-1758-arsenal-team-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1758-arsenal-team-review
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
          python scripts/validate_draft_board.py
          git push origin HEAD:codex/fpl-review-20260802-1758-arsenal-team-review
