name: Temporary Midfield Block 2 Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260803-2256-midfield-31-60'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260803-2256-midfield-31-60
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/review_midfield_block_2.py')
          s = p.read_text()
          new_order = '''new_order = [
              "E.Le Fée", "Enzo", "Maddison", "Sarr", "Minteh",
              "Kudus", "Martinelli", "Neto", "Barnes", "Amad",
              "Rashford", "McNeil", "Mitoma", "Tel", "Savinho",
              "Estêvão", "Dorgu", "Iwobi", "Wilson", "Elanga",
              "J.Murphy", "Smith Rowe", "Gnonto", "Hudson-Odoi", "Rayan",
              "Stach", "Xhaka", "Okafor", "Groß", "Fernandes",
              "Reijnders", "Anderson", "Jensen", "McGinn", "Aaronson",
              "Garnacho", "Mac Allister", "Ndoye", "Lewis-Potter", "Scott",
          ]'''
          s = re.sub(r'new_order = \[.*?\n\]', new_order, s, count=1, flags=re.S)
          comparisons = '''comparisons = [
              ("E.Le Fée", "Enzo", "E.Le Fée", "More advanced role and stronger set-piece route."),
              ("Enzo", "Maddison", "Enzo", "Safer current availability and minutes; Maddison has the higher creative ceiling."),
              ("Maddison", "Sarr", "Maddison", "Set pieces and proven chance creation."),
              ("Sarr", "Minteh", "Sarr", "More established output and role security."),
              ("Minteh", "Kudus", "Minteh", "Current fitness and minutes outlook; a fully fit Kudus can reverse it."),
              ("Kudus", "Martinelli", "Kudus", "Broader attacking role when fit; Martinelli has stronger team context."),
              ("Martinelli", "Neto", "Martinelli", "Higher direct scoring ceiling in an elite attack."),
              ("Neto", "Barnes", "Neto", "Broader creative involvement and slightly safer role."),
              ("Barnes", "Amad", "Barnes", "Higher proven goal-scoring ceiling."),
              ("Amad", "Rashford", "Amad", "Safer current role; Rashford retains the higher historical ceiling."),
              ("Rashford", "McNeil", "Rashford", "Greater direct goal threat despite role uncertainty."),
              ("McNeil", "Mitoma", "McNeil", "Set pieces and current availability outweigh Mitoma's injury uncertainty."),
              ("Mitoma", "Tel", "Mitoma", "Higher proven Premier League attacking output if fit."),
              ("Tel", "Savinho", "Tel", "Clearer direct scoring route; both carry rotation risk."),
              ("Savinho", "Estêvão", "Savinho", "Slightly stronger current minutes pathway."),
              ("Estêvão", "Dorgu", "Estêvão", "Higher attacking ceiling despite greater rotation risk."),
              ("Dorgu", "Iwobi", "Dorgu", "More advanced deployment and direct return potential."),
              ("Iwobi", "Wilson", "Iwobi", "Safer minutes and established Premier League production."),
              ("Wilson", "Elanga", "Wilson", "Set-piece and attacking role narrowly win."),
              ("Elanga", "J.Murphy", "Elanga", "Higher direct goal involvement ceiling."),
              ("J.Murphy", "Smith Rowe", "J.Murphy", "Stronger recent direct-return route."),
              ("Smith Rowe", "Gnonto", "Smith Rowe", "Higher proven creative ceiling."),
              ("Gnonto", "Hudson-Odoi", "Gnonto", "Current fitness and role outlook narrowly win."),
              ("Hudson-Odoi", "Rayan", "Hudson-Odoi", "More proven Premier League scoring route."),
              ("Rayan", "Stach", "Rayan", "More direct attacking role."),
              ("Stach", "Xhaka", "Stach", "Slightly better expected attacking involvement; Xhaka has the safer floor."),
              ("Xhaka", "Okafor", "Xhaka", "Secure minutes and set pieces narrowly beat role uncertainty."),
              ("Okafor", "Groß", "Okafor", "Higher scoring ceiling despite weaker minutes certainty."),
              ("Groß", "Fernandes", "Groß", "Set pieces and proven accumulation floor."),
              ("Fernandes", "Reijnders", "Fernandes", "Slightly safer current role and creative route."),
              ("Reijnders", "Anderson", "Reijnders", "More direct attacking responsibility."),
              ("Anderson", "Jensen", "Anderson", "Stronger minutes outlook and two-way accumulation floor."),
              ("Jensen", "McGinn", "Jensen", "Set-piece access and chance creation."),
              ("McGinn", "Aaronson", "McGinn", "Safer minutes and broader contribution floor."),
              ("Aaronson", "Garnacho", "Aaronson", "More secure current minutes; Garnacho has the higher upside."),
              ("Garnacho", "Mac Allister", "Garnacho", "Greater direct attacking ceiling despite role uncertainty."),
              ("Mac Allister", "Ndoye", "Mac Allister", "Set pieces and secure elite-team minutes."),
              ("Ndoye", "Lewis-Potter", "Ndoye", "Stronger direct scoring route."),
              ("Lewis-Potter", "Scott", "Lewis-Potter", "More advanced attacking role."),
          ]'''
          s = re.sub(r'comparisons = \[.*?\n\]\nreview_path', comparisons + '\nreview_path', s, count=1, flags=re.S)
          s = s.replace('Lower challengers Ayari, Hinshelwood, Sadiki, Berge and Tonali did not enter the top 60 midfielders.', 'Lower challengers Rashford, Mac Allister, Garnacho, McGinn and Reijnders were tested; Rashford and Reijnders entered the top 60 while Mac Allister, Garnacho and McGinn remained below the boundary.')
          s = s.replace('Reijnders and Hutchinson moved only within the reviewed set; neither was promoted on reputation alone.', 'Reijnders entered the top 60 on advanced-role upside; Rashford remained discounted for role uncertainty.')
          s = s.replace('- Reijnders and Hutchinson can rise quickly with sustained advanced deployment.', '- Reijnders can rise further with sustained advanced deployment; Rashford can rise with a secure starting role.')
          p.write_text(s)
          PY
          python scripts/review_midfield_block_2.py
          python scripts/validate_draft_board.py
          rm scripts/review_midfield_block_2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Review midfield positional ranks 31-60"
          git push origin HEAD:codex/fpl-review-20260803-2256-midfield-31-60
