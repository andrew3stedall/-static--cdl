name: Temporary Fix Changelog Time 1400
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  fix:
    if: github.head_ref == 'codex/fpl-review-20260802-1400-ranks81-110-recheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1400-ranks81-110-recheck
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vault/00 Meta/Document Changelog.md')
          t=p.read_text().replace('last_updated: 2026-08-02T14:00:00+10:00','last_updated: 2026-08-02T18:10:00+10:00',1)
          p.write_text(t)
          PY
          rm .github/workflows/tmp-fix-changelog-time-1400.yml
          rm -f .tmp/fix-time-1400.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'vault/00 Meta/Document Changelog.md' '.github/workflows/tmp-fix-changelog-time-1400.yml' '.tmp/fix-time-1400.txt'
          git commit -m "Preserve monotonic changelog timestamp"
          git push origin HEAD:codex/fpl-review-20260802-1400-ranks81-110-recheck
