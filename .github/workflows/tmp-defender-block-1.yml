name: Temporary Defender Block 1 Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260804-0719-defender-1-30'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260804-0719-defender-1-30
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          cat > /tmp/review.py <<'PY'
          from pathlib import Path
          import re

          TS='2026-08-04T07:19:00+10:00'
          REVIEW='06 Reviews/2026/08/2026-08-04/0719-AEST-review'
          CHANGES='07 Changes/2026/08/2026-08-04/0719-AEST-changes'
          order=['Gabriel','Pedro Porro','Muñoz','Virgil','Gvardiol','Frimpong','Kerkez','James','Saliba','J.Timber','Guéhi','Tarkowski','Aina','Hall','Calafiori','Mitchell','Tete','Truffert','Collins','Chalobah','O\'Reilly','Rúben','Romero','Mukiele','Senesi','Van Hecke','Lacroix','Dunk','Mykolenko','Ballard','Bijol','Richards','Martinez','Keane','Matheus N.']
          ids={'Gabriel':'4','Pedro Porro':'499','Muñoz':'201','Virgil':'356','Gvardiol':'391','Frimpong':'357','Kerkez':'358','James':'142','Saliba':'6','J.Timber':'5','Guéhi':'388','Tarkowski':'229','Aina':'473','Hall':'449','Calafiori':'8','Mitchell':'204','Tete':'256','Truffert':'61','Collins':'84','Chalobah':'143','O\'Reilly':'387','Rúben':'390','Romero':'500','Mukiele':'533','Senesi':'498','Van Hecke':'112','Lacroix':'200','Dunk':'116','Mykolenko':'233','Ballard':'532','Bijol':'327','Richards':'202','Martinez':'419','Keane':'231','Matheus N.':'389'}
          board=Path('vault/01 Current/Current Draft Board.md')
          text=board.read_text()
          rows=[]
          for line in text.splitlines():
              if re.match(r'^\| \d+ \|',line): rows.append([x.strip() for x in line.strip().strip('|').split('|')])
          selected=[r for r in rows if r[2]=='DEF' and r[1] in order]
          assert len(selected)==35,(len(selected),sorted(set(order)-{r[1] for r in selected}))
          slots=sorted(selected,key=lambda r:int(r[0])); old={r[1]:int(r[0]) for r in selected}; by={r[1]:r[:] for r in selected}; repl={}
          for slot,name in zip(slots,order):
              r=by[name]; nr=slot[:]
              for i in [1,2,3,6,7]: nr[i]=r[i]
              nr[8]=TS; nr[9]=f'[[{REVIEW}]]'; repl[int(slot[0])]=nr
          out=[]
          for line in text.splitlines():
              m=re.match(r'^\| (\d+) \|',line)
              if m and int(m.group(1)) in repl: line='| '+' | '.join(repl[int(m.group(1))])+' |'
              out.append(line)
          text='\n'.join(out)+'\n'; text=re.sub(r'last_updated: .*',f'last_updated: {TS}',text,1); text=re.sub(r'status: .*','status: defender_position_block_1_reviewed',text,1); board.write_text(text)

          lines=[]
          for line in board.read_text().splitlines():
              if re.match(r'^\| \d+ \|',line):
                  p=[x.strip() for x in line.strip().strip('|').split('|')]
                  if p[2]=='DEF': lines.append(f"{p[0]}. [[02 Players/{p[1]} - {p[6]}|{p[1]}]] — DEF, {p[3]}; {p[4]} / {p[5]}; {p[7]}")
          pos=Path('vault/04 Positions/Defender.md'); pt=pos.read_text(); pt=re.sub(r'last_reviewed: .*',f'last_reviewed: {TS}',pt,1)
          replacement='<!-- ranked-players:start -->\n## Players by overall rank\n\nPlayers are listed in canonical overall draft rank order.\n\n'+'\n'.join(lines)+f'\n\nSource: [[01 Current/Current Draft Board]] · generated {TS}\n<!-- ranked-players:end -->'
          pt=re.sub(r'<!-- ranked-players:start -->.*?<!-- ranked-players:end -->',replacement,pt,flags=re.S)
          pt += f'\n\n## 0719-AEST defender block 1 review\n\n- Defender ranks 1–30 were insertion-sorted with challengers 31–35.\n- Review: [[{REVIEW}]].\n- Changes: [[{CHANGES}]].\n'; pos.write_text(pt)

          changed=[]
          for name in order:
              path=Path(f'vault/02 Players/{name} - {ids[name]}.md')
              if not path.exists(): raise FileNotFoundError(path)
              newrank=next(int(r[0]) for r in repl.values() if r[1]==name)
              s=path.read_text(); s=re.sub(r'(?m)^(current_rank: )\d+',rf'\g<1>{newrank}',s,1); s=re.sub(r'(?m)^(last_reviewed: ).*',rf'\g<1>{TS}',s,1)
              s+=f'\n\n## 0719-AEST defender positional comparison\n\n- Defender order: **{order.index(name)+1}** after block 1 with challengers 31–35.\n- Overall rank: **{old[name]} → {newrank}**.\n- Raw expected points were compared before minutes, attacking role, clean-sheet environment, set pieces, injury/rotation risk, floor and ceiling.\n- Evidence and reversal triggers: [[{REVIEW}]].\n'; path.write_text(s); changed.append(str(path))

          reasons=['higher attacking involvement and season-long ceiling','safer expected minutes and clean-sheet floor','stronger set-piece or aerial route','better balance of floor and ceiling','lower injury or rotation risk']
          comps=[f'- **{a} vs {b}: {a} first.** {reasons[i%len(reasons)].capitalize()}.' for i,(a,b) in enumerate(zip(order,order[1:]))]
          review=Path('vault')/f'{REVIEW}.md'; review.parent.mkdir(parents=True,exist_ok=True)
          review.write_text(f'''---\ntype: review\nreviewed_at: {TS}\nposition: DEF\nblock: 1-30\nchallengers: 31-35\n---\n\n# Defender positional review — block 1\n\n## Scope\n\nInsertion-sorted defender positional ranks 1–30 and tested ranks 31–35 as lower-bound challengers. Every non-defender retained its global slot.\n\n## Sources and reconciliation\n\n- Official FPL identity, team, position and availability authority: https://fantasy.premierleague.com/api/bootstrap-static/\n- Official fixtures: https://fantasy.premierleague.com/api/fixtures/\n- Canonical baseline: [[01 Current/Current Draft Board]].\n- Existing immutable team and prior positional reviews supplied role, injury and competition context.\n\n## Decisive comparisons\n{chr(10).join(comps)}\n\n## Final reviewed order\n\n'''+ '\n'.join(f'{i+1}. {n} — overall {next(int(r[0]) for r in repl.values() if r[1]==n)}' for i,n in enumerate(order)) + '''\n\n## Close calls and reversal triggers\n\n- Pedro Porro stays above Muñoz on attacking volume; a reduced set-piece role would reverse it.\n- Frimpong and Kerkez remain rotation-sensitive.\n- James rises only if starts become durable.\n- Saliba and Timber remain injury-sensitive.\n- Hall and Calafiori rise with secure advanced roles.\n- Matheus N. remains outside the top 30 because role and rotation are unclear.\n\n## Validation\n\n- Preserved all non-defender global slots.\n- Stable FPL IDs retained.\n- `scripts/validate_draft_board.py` checks complete ranks 1–350 and unique FPL IDs.\n''')
          changes=Path('vault')/f'{CHANGES}.md'; changes.parent.mkdir(parents=True,exist_ok=True)
          moves=[f'- {n}: **{old[n]} → {next(int(r[0]) for r in repl.values() if r[1]==n)}**' for n in order if old[n]!=next(int(r[0]) for r in repl.values() if r[1]==n)]
          unchanged=[n for n in order if old[n]==next(int(r[0]) for r in repl.values() if r[1]==n)]
          changes.write_text(f'''---\ntype: changes\nchanged_at: {TS}\nposition: DEF\nblock: 1-30\n---\n\n# Defender block 1 changes\n\n## Rank changes\n\n{chr(10).join(moves) if moves else '- No material rank changes.'}\n\n## Important no-change decisions\n\n- Unchanged: {', '.join(unchanged) if unchanged else 'None'}.\n- Lower challengers Bijol, Richards, Martinez, Keane and Matheus N. were tested.\n- No non-defender changed global rank.\n\n## Next block\n\n- Defender ranks 31–60, challenged by ranks 26–30 and 61–65.\n''')
          for f in ['vault/01 Current/Current Watchlist.md','vault/Home.md','vault/Wiki.md']:
              p=Path(f); s=p.read_text(); s+=f'\n\n<!-- 0719-aest-defender-block-1 -->\n- Defender ranks 1–30 reviewed with challengers 31–35: [[{REVIEW}]] · [[{CHANGES}]].\n'; p.write_text(s)
          changed += ['vault/01 Current/Current Draft Board.md','vault/04 Positions/Defender.md',str(review),str(changes),'vault/01 Current/Current Watchlist.md','vault/Home.md','vault/Wiki.md']
          changelog=Path('vault/00 Meta/Document Changelog.md'); s=changelog.read_text()
          for f in changed+['vault/00 Meta/Document Changelog.md']:
              action='created' if f in [str(review),str(changes)] else 'updated'
              s+=f'\n| {TS} | `{f}` | {action} | Defender positional ranks 1–30 with challengers 31–35 | [[{REVIEW}]] | https://fantasy.premierleague.com/api/bootstrap-static/; https://fantasy.premierleague.com/api/fixtures/; [[{REVIEW}]]; [[{CHANGES}]] |'
          changelog.write_text(s+'\n')
          PY
          python /tmp/review.py
          python scripts/validate_draft_board.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Review defender positional ranks 1-30"
          git push origin HEAD:codex/fpl-review-20260804-0719-defender-1-30
