name: Validate Draft Board

on:
  pull_request:
    paths:
      - "vault/01 Current/Current Draft Board.md"
      - "scripts/validate_draft_board.py"
      - ".github/workflows/validate-draft-board.yml"
  push:
    branches: [main]
    paths:
      - "vault/01 Current/Current Draft Board.md"
      - "scripts/validate_draft_board.py"
      - ".github/workflows/validate-draft-board.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_draft_board.py
