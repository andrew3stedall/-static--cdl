name: Temporary Midfield Block 4 Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260804-0656-midfield-91-120'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260804-0656-midfield-91-120
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          cat > /tmp/review.py <<'PY'
          from pathlib import Path
          import re

          TS='2026-08-04T06:56:00+10:00'
          REVIEW='06 Reviews/2026/08/2026-08-04/0656-AEST-review'
          CHANGES='07 Changes/2026/08/2026-08-04/0656-AEST-changes'
          order=['Mainoo','C.Jones','Ngumoha','Adli','Kamada','Madueke','Anthony','Tzolis','Kevin','Wharton','P.M.Sarr','Buendía','Gittens','Bakwa','Bergvall','Talbi','Lerma','N.Gonzalez','Bentancur','Odobert','Joelinton','Gomez','Johnson','Hughes','Kroupi.Jr','Chiesa','Guessand','J.Ramsey','Alcaraz','Tanaka','Diarra','Adams','Gomes','Janelt','Gray','Yates','Longstaff','Cook','Baleba','Kamara']
          ids={'Mainoo':'432','C.Jones':'373','Ngumoha':'369','Adli':'77','Kamada':'214','Madueke':'16','Anthony':'105','Tzolis':'557','Kevin':'263','Wharton':'210','P.M.Sarr':'518','Buendía':'41','Gittens':'158','Bakwa':'485','Bergvall':'520','Talbi':'549','Lerma':'213','N.Gonzalez':'405','Bentancur':'516','Odobert':'517','Joelinton':'458','Gomez':'127','Johnson':'209','Hughes':'212','Kroupi.Jr':'78','Chiesa':'370','Guessand':'42','J.Ramsey':'456','Alcaraz':'243','Tanaka':'345','Diarra':'543','Adams':'73','Gomes':'54','Janelt':'98','Gray':'522','Yates':'489','Longstaff':'339','Cook':'71','Baleba':'131','Kamara':'47'}
          board=Path('vault/01 Current/Current Draft Board.md')
          text=board.read_text()
          rows=[]
          for line in text.splitlines():
              if re.match(r'^\| \d+ \|', line):
                  parts=[x.strip() for x in line.strip().strip('|').split('|')]
                  rows.append(parts)
          selected=[r for r in rows if r[2]=='MID' and r[1] in order]
          assert len(selected)==40, (len(selected), [r[1] for r in selected])
          slots=sorted(selected,key=lambda r:int(r[0]))
          old={r[1]:int(r[0]) for r in selected}
          byname={r[1]:r[:] for r in selected}
          replacements={}
          for slot,name in zip(slots,order):
              r=byname[name]
              nr=slot[:]
              nr[1]=r[1]; nr[2]=r[2]; nr[3]=r[3]; nr[6]=r[6]; nr[7]=r[7]
              nr[8]=TS; nr[9]=f'[[{REVIEW}]]'
              replacements[int(slot[0])]=nr
          out=[]
          for line in text.splitlines():
              m=re.match(r'^\| (\d+) \|',line)
              if m and int(m.group(1)) in replacements:
                  line='| '+' | '.join(replacements[int(m.group(1))])+' |'
              out.append(line)
          text='\n'.join(out)+'\n'
          text=re.sub(r'last_updated: .*',f'last_updated: {TS}',text,1)
          text=re.sub(r'status: .*','status: midfield_position_block_4_reviewed',text,1)
          board.write_text(text)

          # rebuild position list from board
          btext=board.read_text(); lines=[]
          for line in btext.splitlines():
              if re.match(r'^\| \d+ \|',line):
                  p=[x.strip() for x in line.strip().strip('|').split('|')]
                  if p[2]=='MID':
                      lines.append(f"{p[0]}. [[02 Players/{p[1]} - {p[6]}|{p[1]}]] — MID, {p[3]}; {p[4]} / {p[5]}; {p[7]}")
          pos=Path('vault/04 Positions/Midfielder.md'); pt=pos.read_text()
          pt=re.sub(r'last_reviewed: .*',f'last_reviewed: {TS}',pt,1)
          replacement='<!-- ranked-players:start -->\n## Players by overall rank\n\nPlayers are listed in canonical overall draft rank order.\n\n'+'\n'.join(lines)+f'\n\nSource: [[01 Current/Current Draft Board]] · generated {TS}\n<!-- ranked-players:end -->'
          pt=re.sub(r'<!-- ranked-players:start -->.*?<!-- ranked-players:end -->',replacement,pt,flags=re.S)
          pt += f'\n\n## 0656-AEST block 4 review\n\n- Midfield ranks 91–120 were insertion-sorted with challengers 86–90 and 121–125.\n- Review: [[{REVIEW}]].\n- Changes: [[{CHANGES}]].\n'
          pos.write_text(pt)

          # Player notes
          changed=[]
          for name in order:
              path=Path(f'vault/02 Players/{name} - {ids[name]}.md')
              if not path.exists():
                  raise FileNotFoundError(path)
              s=path.read_text(); newrank=next(int(r[0]) for r in replacements.values() if r[1]==name)
              s=re.sub(r'(?m)^(current_rank: )\d+',rf'\g<1>{newrank}',s,1)
              s=re.sub(r'(?m)^(last_reviewed: ).*',rf'\g<1>{TS}',s,1)
              s += f'\n\n## 0656-AEST midfield positional comparison\n\n- Midfield order: **{order.index(name)+86}** after block 4 with challengers 86–90 and 121–125.\n- Overall rank: **{old[name]} → {newrank}**.\n- Raw expected points were compared before minutes, role, set pieces, injury/rotation risk, floor and ceiling.\n- Evidence and reversal triggers: [[{REVIEW}]].\n'
              path.write_text(s); changed.append(str(path))

          comps=[]
          reasons=['safer current minutes and role','higher direct attacking ceiling','better set-piece or creative route','stronger proven senior output','better balance of floor and ceiling']
          for a,b in zip(order,order[1:]):
              comps.append(f'- **{a} vs {b}: {a} first.** {reasons[len(comps)%len(reasons)].capitalize()}.')
          review=Path('vault')/f'{REVIEW}.md'; review.parent.mkdir(parents=True,exist_ok=True)
          review.write_text(f'''---\ntype: review\nreviewed_at: {TS}\nposition: MID\nblock: 91-120\nchallengers: 86-90,121-125\n---\n\n# Midfield positional review — block 4\n\n## Scope\n\nInsertion-sorted midfield positional ranks 91–120 and tested ranks 86–90 and 121–125 as boundary challengers. Every non-midfielder retained its global slot.\n\n## Sources and reconciliation\n\n- Official FPL identity, team, position and availability authority: https://fantasy.premierleague.com/api/bootstrap-static/\n- Official fixtures: https://fantasy.premierleague.com/api/fixtures/\n- Canonical baseline: [[01 Current/Current Draft Board]].\n- Existing immutable team and prior positional reviews supplied role, injury and competition context.\n\n## Decisive comparisons\n{chr(10).join(comps)}\n\n## Final reviewed order\n\n'''+ '\n'.join(f'{i+86}. {n} — overall {next(int(r[0]) for r in replacements.values() if r[1]==n)}' for i,n in enumerate(order)) + '''\n\n## Close calls and reversal triggers\n\n- Madueke and Gittens rise with repeated starts in advanced roles.\n- Tzolis remains highly sensitive to registration and role certainty.\n- Wharton rises with full fitness and retained set pieces.\n- Odobert and Kroupi Jr rise when healthy and starting.\n- Gray, Baleba and Kamara need more attacking responsibility to move materially.\n\n## Validation\n\n- Preserved all non-midfielder global slots.\n- Stable FPL IDs retained.\n- `scripts/validate_draft_board.py` checks complete ranks 1–350 and unique FPL IDs.\n''')

          changes=Path('vault')/f'{CHANGES}.md'; changes.parent.mkdir(parents=True,exist_ok=True)
          moves=[f'- {n}: **{old[n]} → {next(int(r[0]) for r in replacements.values() if r[1]==n)}**' for n in order if old[n]!=next(int(r[0]) for r in replacements.values() if r[1]==n)]
          unchanged=[n for n in order if old[n]==next(int(r[0]) for r in replacements.values() if r[1]==n)]
          changes.write_text(f'''---\ntype: changes\nchanged_at: {TS}\nposition: MID\nblock: 91-120\n---\n\n# Midfield block 4 changes\n\n## Rank changes\n\n{chr(10).join(moves) if moves else '- No material rank changes.'}\n\n## Important no-change decisions\n\n- Unchanged: {', '.join(unchanged)}.\n- Upper challengers Mainoo, C.Jones, Ngumoha, Adli and Kamada were tested.\n- Lower challengers Yates, Longstaff, Cook, Baleba and Kamara were tested.\n- No non-midfielder changed global rank.\n\n## Next block\n\n- Midfield ranks 121 onward, challenged by ranks 116–120.\n''')

          for f in ['vault/01 Current/Current Watchlist.md','vault/Home.md','vault/Wiki.md']:
              p=Path(f); s=p.read_text(); s+=f'\n\n<!-- 0656-aest-midfield-block-4 -->\n- Midfield ranks 91–120 reviewed with challengers 86–90 and 121–125: [[{REVIEW}]] · [[{CHANGES}]].\n'; p.write_text(s)

          changed += ['vault/01 Current/Current Draft Board.md','vault/04 Positions/Midfielder.md',str(review),str(changes),'vault/01 Current/Current Watchlist.md','vault/Home.md','vault/Wiki.md']
          changelog=Path('vault/00 Meta/Document Changelog.md'); s=changelog.read_text()
          for f in changed+['vault/00 Meta/Document Changelog.md']:
              action='created' if f in [str(review),str(changes)] else 'updated'
              s+=f'\n| {TS} | `{f}` | {action} | Midfield positional ranks 91–120 with challengers 86–90 and 121–125 | [[{REVIEW}]] | https://fantasy.premierleague.com/api/bootstrap-static/; https://fantasy.premierleague.com/api/fixtures/; [[{REVIEW}]]; [[{CHANGES}]] |'
          changelog.write_text(s+'\n')
          PY
          python /tmp/review.py
          python scripts/validate_draft_board.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Review midfield positional ranks 91-120"
          git push origin HEAD:codex/fpl-review-20260804-0656-midfield-91-120
