name: Temporary FPL ranks 111-140 review
on:
  push:
    paths:
      - .github/workflows/tmp-fpl-review-1101.yml
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1101-ranks111-140
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fpl_review_1101.py
      - run: |
          rm scripts/fpl_review_1101.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vault
          git add -u scripts/fpl_review_1101.py
          git commit -m "Review FPL Draft ranks 111-140"
          git push origin HEAD:codex/fpl-review-20260802-1101-ranks111-140
