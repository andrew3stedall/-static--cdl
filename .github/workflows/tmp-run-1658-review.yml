name: Temporary 1658 FPL Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  review:
    if: github.head_ref == 'codex/fpl-review-20260802-1658-ranks171-200-recheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1658-ranks171-200-recheck
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python scripts/run_1658_review.py
          python scripts/validate_draft_board.py
          rm scripts/run_1658_review.py .github/workflows/tmp-run-1658-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- vault scripts .github/workflows
          git commit -m "Complete 1658 ranks 171-200 review"
          git push origin HEAD:codex/fpl-review-20260802-1658-ranks171-200-recheck
