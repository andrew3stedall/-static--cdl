name: Run second FPL top-80 review

on:
  push:
    branches:
      - codex/fpl-review-20260801-1848-top80-source-correction
    paths:
      - scripts/apply_top80_source_review.py
      - .github/workflows/run-top80-source-review.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260801-1848-top80-source-correction
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed top-80 order
        run: python scripts/apply_top80_source_review.py
      - name: Commit generated board and audit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "vault/01 Current/Current Draft Board.md" \
            "vault/09 Data/2026-08-01-1848-official-api-snapshot.json" \
            "vault/09 Data/2026-08-01-1848-top80-movements.json"
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Apply 1848 AEST top-80 source review"
            git push origin HEAD:codex/fpl-review-20260801-1848-top80-source-correction
          fi
