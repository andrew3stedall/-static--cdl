name: Temporary FPL review 141-180
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260802-1148-ranks141-180'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1148-ranks141-180
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fpl_review_141_180.py
      - run: |
          rm scripts/fpl_review_141_180.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Review FPL Draft ranks 141-180"
          git push origin HEAD:codex/fpl-review-20260802-1148-ranks141-180
