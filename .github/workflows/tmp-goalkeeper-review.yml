name: Temporary Goalkeeper Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260804-1144-goalkeepers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260804-1144-goalkeepers
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          cat > /tmp/review.py <<'PY'
          from pathlib import Path
          import re

          TS='2026-08-04T11:44:00+10:00'
          REVIEW='06 Reviews/2026/08/2026-08-04/1144-AEST-review'
          CHANGES='07 Changes/2026/08/2026-08-04/1144-AEST-changes'
          order=['Raya','Donnarumma','A.Becker','Pickford','Henderson','Pope','Vicario','Kelleher','Sánchez','Petrović','Verbruggen','Leno','Sels','Roefs','Lammens','Martinez','Perri','Wilson','Palmer','Kinsky','Dubravka','Mamardashvili','Darlow']

          board=Path('vault/01 Current/Current Draft Board.md')
          text=board.read_text()
          rows=[]
          for line in text.splitlines():
              if re.match(r'^\| \d+ \|',line): rows.append([x.strip() for x in line.strip().strip('|').split('|')])
          selected=sorted([r for r in rows if r[2]=='GKP'], key=lambda r:int(r[0]))
          assert len(selected)==23, len(selected)
          names=[r[1] for r in selected]
          assert set(names)==set(order), (set(names)-set(order),set(order)-set(names))
          slots=selected
          old={r[1]:int(r[0]) for r in selected}; by={r[1]:r[:] for r in selected}; repl={}
          for slot,name in zip(slots,order):
              r=by[name]; nr=slot[:]
              for i in [1,2,3,6,7]: nr[i]=r[i]
              nr[8]=TS; nr[9]=f'[[{REVIEW}]]'; repl[int(slot[0])]=nr
          out=[]
          for line in text.splitlines():
              m=re.match(r'^\| (\d+) \|',line)
              if m and int(m.group(1)) in repl: line='| '+' | '.join(repl[int(m.group(1))])+' |'
              out.append(line)
          text='\n'.join(out)+'\n'
          text=re.sub(r'last_updated: .*',f'last_updated: {TS}',text,1)
          text=re.sub(r'status: .*','status: goalkeeper_position_complete',text,1)
          board.write_text(text)

          lines=[]
          for line in board.read_text().splitlines():
              if re.match(r'^\| \d+ \|',line):
                  p=[x.strip() for x in line.strip().strip('|').split('|')]
                  if p[2]=='GKP': lines.append(f"{p[0]}. [[02 Players/{p[1]} - {p[6]}|{p[1]}]] — GKP, {p[3]}; {p[4]} / {p[5]}; {p[7]}")
          pos=Path('vault/04 Positions/Goalkeeper.md')
          pt=pos.read_text()
          pt=re.sub(r'last_reviewed: .*',f'last_reviewed: {TS}',pt,1)
          pt=re.sub(r'## Current leaders\n\n.*?\n\n## Strategy', '## Current leaders\n\n1. Raya\n2. Donnarumma\n3. A.Becker\n4. Pickford\n5. Henderson\n\n## Strategy', pt, flags=re.S)
          replacement='<!-- ranked-players:start -->\n## Players by overall rank\n\nPlayers are listed in canonical overall draft rank order.\n\n'+'\n'.join(lines)+f'\n\nSource: [[01 Current/Current Draft Board]] · generated {TS}\n<!-- ranked-players:end -->'
          pt=re.sub(r'<!-- ranked-players:start -->.*?<!-- ranked-players:end -->',replacement,pt,flags=re.S)
          pt += f'\n\n## 1144-AEST goalkeeper review\n\n- All 23 goalkeepers were insertion-sorted in one block.\n- Review: [[{REVIEW}]].\n- Changes: [[{CHANGES}]].\n'
          pos.write_text(pt)

          changed=[]
          for idx,name in enumerate(order,1):
              row=by[name]; fid=row[6]; path=Path(f'vault/02 Players/{name} - {fid}.md')
              if not path.exists(): raise FileNotFoundError(path)
              newrank=next(int(r[0]) for r in repl.values() if r[1]==name)
              s=path.read_text()
              s=re.sub(r'(?m)^(current_rank: )\d+',rf'\g<1>{newrank}',s,1)
              s=re.sub(r'(?m)^(last_reviewed: ).*',rf'\g<1>{TS}',s,1)
              s+=f'\n\n## 1144-AEST goalkeeper positional comparison\n\n- Goalkeeper order: **{idx} of 23**.\n- Overall rank: **{old[name]} → {newrank}**.\n- Compared on expected clean sheets, save volume, bonus potential, first-choice security, injury risk and replacement value.\n- Evidence and reversal triggers: [[{REVIEW}]].\n'
              path.write_text(s); changed.append(str(path))

          reasons=['stronger clean-sheet expectation','safer first-choice status','better save and bonus profile','stronger defensive environment','lower role or injury risk']
          comps=[f'- **{a} vs {b}: {a} first.** {reasons[i%len(reasons)].capitalize()}.' for i,(a,b) in enumerate(zip(order,order[1:]))]
          review=Path('vault')/f'{REVIEW}.md'; review.parent.mkdir(parents=True,exist_ok=True)
          review.write_text(f'''---\ntype: review\nreviewed_at: {TS}\nposition: GKP\nblock: all\n---\n\n# Goalkeeper positional review\n\n## Scope\n\nAll 23 ranked goalkeepers were insertion-sorted in one block. Every non-goalkeeper retained its global slot.\n\n## Sources and reconciliation\n\n- Official FPL authority: https://fantasy.premierleague.com/api/bootstrap-static/\n- Official fixtures: https://fantasy.premierleague.com/api/fixtures/\n- Canonical baseline: [[01 Current/Current Draft Board]].\n- Existing team reviews supplied first-choice, injury and competition context.\n\n## Decisive comparisons\n{chr(10).join(comps)}\n\n## Final goalkeeper order\n\n'''+ '\n'.join(f'{i}. {n} — overall {next(int(r[0]) for r in repl.values() if r[1]==n)}' for i,n in enumerate(order,1)) + '''\n\n## Close calls and reversal triggers\n\n- Donnarumma and A.Becker are close; confirmed rotation or role changes can reverse them.\n- Pickford retains a strong save and bonus floor despite a weaker clean-sheet environment than the elite clubs.\n- Pope, Vicario, Kelleher and Sánchez form a close second tier.\n- Roefs and Lammens depend heavily on confirmed first-choice status.\n- Kinsky, Dubravka, Mamardashvili and Darlow remain backup-sensitive and should not be drafted without a hierarchy change.\n\n## Validation\n\n- Preserved all non-goalkeeper global slots.\n- Stable FPL IDs retained.\n- `scripts/validate_draft_board.py` checks complete ranks 1–350 and unique FPL IDs.\n''')

          changes=Path('vault')/f'{CHANGES}.md'; changes.parent.mkdir(parents=True,exist_ok=True)
          moves=[f'- {n}: **{old[n]} → {next(int(r[0]) for r in repl.values() if r[1]==n)}**' for n in order if old[n]!=next(int(r[0]) for r in repl.values() if r[1]==n)]
          unchanged=[n for n in order if old[n]==next(int(r[0]) for r in repl.values() if r[1]==n)]
          changes.write_text(f'''---\ntype: changes\nchanged_at: {TS}\nposition: GKP\nblock: all\n---\n\n# Goalkeeper positional changes\n\n## Rank changes\n\n{chr(10).join(moves) if moves else '- No material rank changes.'}\n\n## Important no-change decisions\n\n- Unchanged: {', '.join(unchanged) if unchanged else 'None'}.\n- No non-goalkeeper changed global rank.\n\n## Position status\n\n- All goalkeepers are now positionally reviewed.\n- All four positions are now complete.\n- Next phase: global cross-position consistency review.\n''')

          for f in ['vault/01 Current/Current Watchlist.md','vault/Home.md','vault/Wiki.md']:
              p=Path(f); s=p.read_text(); s+=f'\n\n<!-- 1144-aest-goalkeeper-review -->\n- All goalkeepers positionally reviewed: [[{REVIEW}]] · [[{CHANGES}]].\n'; p.write_text(s)
          changed += ['vault/01 Current/Current Draft Board.md','vault/04 Positions/Goalkeeper.md',str(review),str(changes),'vault/01 Current/Current Watchlist.md','vault/Home.md','vault/Wiki.md']
          changelog=Path('vault/00 Meta/Document Changelog.md'); s=changelog.read_text()
          for f in changed+['vault/00 Meta/Document Changelog.md']:
              action='created' if f in [str(review),str(changes)] else 'updated'
              s+=f'\n| {TS} | `{f}` | {action} | Complete goalkeeper positional review | [[{REVIEW}]] | https://fantasy.premierleague.com/api/bootstrap-static/; https://fantasy.premierleague.com/api/fixtures/; [[{REVIEW}]]; [[{CHANGES}]] |'
          changelog.write_text(s+'\n')
          PY
          python /tmp/review.py
          python scripts/validate_draft_board.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete goalkeeper positional review"
          git push origin HEAD:codex/fpl-review-20260804-1144-goalkeepers
