name: Temporary FPL 201-220 main runner
on:
  push:
    paths:
      - .github/workflows/tmp-fpl-201-220-main-runner.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-0848-ranks201-220
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fpl_block_201_220.py
      - run: |
          rm scripts/fpl_block_201_220.py .github/workflows/tmp-fpl-201-220-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete ranks 201-220 pairwise review"
          git push origin HEAD:codex/fpl-review-20260802-0848-ranks201-220
