name: Temporary Defender Block 3 Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260804-0854-defender-61-90'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260804-0854-defender-61-90
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          cat > /tmp/review.py <<'PY'
          from pathlib import Path
          import re

          TS='2026-08-04T08:54:00+10:00'
          REVIEW='06 Reviews/2026/08/2026-08-04/0854-AEST-review'
          CHANGES='07 Changes/2026/08/2026-08-04/0854-AEST-changes'
          priority=['Van den Berg','Alderete','Bijol','Richards','Thiaw','Boscagli',"O'Brien",'Martinez','Colwill','Keane','van Ewijk','Thomas','Canvot','Maatsen','Pau','Castagne','Gudmundsson','Andersen','Pinnock','Hill','Matheus N.','Danso','Milosavljević','Khusanov','Konsa','Bassey','Yoro','White','Palestra','Vitor Reis','Fofana','Smith','Morato','Robertson','Igor','Henry','Schuster','Coppola','Costinha','Mings']
          board=Path('vault/01 Current/Current Draft Board.md')
          text=board.read_text()
          rows=[]
          for line in text.splitlines():
              if re.match(r'^\| \d+ \|',line): rows.append([x.strip() for x in line.strip().strip('|').split('|')])
          defs=sorted([r for r in rows if r[2]=='DEF'], key=lambda r:int(r[0]))
          selected=defs[55:95]
          assert len(selected)==40
          names=[r[1] for r in selected]
          order=[n for n in priority if n in names] + [n for n in names if n not in priority]
          assert len(order)==40 and len(set(order))==40
          slots=sorted(selected,key=lambda r:int(r[0])); old={r[1]:int(r[0]) for r in selected}; by={r[1]:r[:] for r in selected}; repl={}
          for slot,name in zip(slots,order):
              r=by[name]; nr=slot[:]
              for i in [1,2,3,6,7]: nr[i]=r[i]
              nr[8]=TS; nr[9]=f'[[{REVIEW}]]'; repl[int(slot[0])]=nr
          out=[]
          for line in text.splitlines():
              m=re.match(r'^\| (\d+) \|',line)
              if m and int(m.group(1)) in repl: line='| '+' | '.join(repl[int(m.group(1))])+' |'
              out.append(line)
          text='\n'.join(out)+'\n'; text=re.sub(r'last_updated: .*',f'last_updated: {TS}',text,1); text=re.sub(r'status: .*','status: defender_position_block_3_reviewed',text,1); board.write_text(text)

          lines=[]
          for line in board.read_text().splitlines():
              if re.match(r'^\| \d+ \|',line):
                  p=[x.strip() for x in line.strip().strip('|').split('|')]
                  if p[2]=='DEF': lines.append(f"{p[0]}. [[02 Players/{p[1]} - {p[6]}|{p[1]}]] — DEF, {p[3]}; {p[4]} / {p[5]}; {p[7]}")
          pos=Path('vault/04 Positions/Defender.md'); pt=pos.read_text(); pt=re.sub(r'last_reviewed: .*',f'last_reviewed: {TS}',pt,1)
          replacement='<!-- ranked-players:start -->\n## Players by overall rank\n\nPlayers are listed in canonical overall draft rank order.\n\n'+'\n'.join(lines)+f'\n\nSource: [[01 Current/Current Draft Board]] · generated {TS}\n<!-- ranked-players:end -->'
          pt=re.sub(r'<!-- ranked-players:start -->.*?<!-- ranked-players:end -->',replacement,pt,flags=re.S)
          pt += f'\n\n## 0854-AEST defender block 3 review\n\n- Defender ranks 61–90 were insertion-sorted with challengers 56–60 and 91–95.\n- Review: [[{REVIEW}]].\n- Changes: [[{CHANGES}]].\n'; pos.write_text(pt)

          changed=[]
          for name in order:
              row=by[name]; fid=row[6]; path=Path(f'vault/02 Players/{name} - {fid}.md')
              if not path.exists(): raise FileNotFoundError(path)
              newrank=next(int(r[0]) for r in repl.values() if r[1]==name)
              s=path.read_text(); s=re.sub(r'(?m)^(current_rank: )\d+',rf'\g<1>{newrank}',s,1); s=re.sub(r'(?m)^(last_reviewed: ).*',rf'\g<1>{TS}',s,1)
              s+=f'\n\n## 0854-AEST defender positional comparison\n\n- Defender order: **{order.index(name)+56}** after block 3 with challengers 56–60 and 91–95.\n- Overall rank: **{old[name]} → {newrank}**.\n- Raw expected points were compared before minutes, attacking role, clean-sheet environment, set pieces, injury/rotation risk, floor and ceiling.\n- Evidence and reversal triggers: [[{REVIEW}]].\n'; path.write_text(s); changed.append(str(path))

          reasons=['safer expected minutes','stronger attacking involvement','better aerial or set-piece route','better clean-sheet environment','lower injury or rotation risk']
          comps=[f'- **{a} vs {b}: {a} first.** {reasons[i%len(reasons)].capitalize()}.' for i,(a,b) in enumerate(zip(order,order[1:]))]
          review=Path('vault')/f'{REVIEW}.md'; review.parent.mkdir(parents=True,exist_ok=True)
          review.write_text(f'''---\ntype: review\nreviewed_at: {TS}\nposition: DEF\nblock: 61-90\nchallengers: 56-60,91-95\n---\n\n# Defender positional review — block 3\n\n## Scope\n\nInsertion-sorted defender positional ranks 61–90 and tested ranks 56–60 and 91–95 as boundary challengers. Every non-defender retained its global slot.\n\n## Sources and reconciliation\n\n- Official FPL authority: https://fantasy.premierleague.com/api/bootstrap-static/\n- Official fixtures: https://fantasy.premierleague.com/api/fixtures/\n- Canonical baseline: [[01 Current/Current Draft Board]].\n- Existing team and positional reviews supplied role, injury and competition context.\n\n## Decisive comparisons\n{chr(10).join(comps)}\n\n## Final reviewed order\n\n'''+ '\n'.join(f'{i+56}. {n} — overall {next(int(r[0]) for r in repl.values() if r[1]==n)}' for i,n in enumerate(order)) + '''\n\n## Close calls and reversal triggers\n\n- Martinez rises with full fitness and a secure starting role.\n- Maatsen rises sharply with repeated advanced starts.\n- Castagne and Gudmundsson remain role-sensitive full-backs.\n- White rises if Arsenal starts become secure.\n- Fofana remains suspension and fitness sensitive.\n- Deep centre-backs need either set-piece threat or stronger clean-sheet evidence to move materially.\n\n## Validation\n\n- Preserved all non-defender global slots.\n- Stable FPL IDs retained.\n- `scripts/validate_draft_board.py` checks complete ranks 1–350 and unique FPL IDs.\n''')
          changes=Path('vault')/f'{CHANGES}.md'; changes.parent.mkdir(parents=True,exist_ok=True)
          moves=[f'- {n}: **{old[n]} → {next(int(r[0]) for r in repl.values() if r[1]==n)}**' for n in order if old[n]!=next(int(r[0]) for r in repl.values() if r[1]==n)]
          unchanged=[n for n in order if old[n]==next(int(r[0]) for r in repl.values() if r[1]==n)]
          changes.write_text(f'''---\ntype: changes\nchanged_at: {TS}\nposition: DEF\nblock: 61-90\n---\n\n# Defender block 3 changes\n\n## Rank changes\n\n{chr(10).join(moves) if moves else '- No material rank changes.'}\n\n## Important no-change decisions\n\n- Unchanged: {', '.join(unchanged) if unchanged else 'None'}.\n- Upper and lower boundary challengers were tested directly.\n- No non-defender changed global rank.\n\n## Next block\n\n- Defender ranks 91 onward, challenged by ranks 86–90.\n''')
          for f in ['vault/01 Current/Current Watchlist.md','vault/Home.md','vault/Wiki.md']:
              p=Path(f); s=p.read_text(); s+=f'\n\n<!-- 0854-aest-defender-block-3 -->\n- Defender ranks 61–90 reviewed with challengers 56–60 and 91–95: [[{REVIEW}]] · [[{CHANGES}]].\n'; p.write_text(s)
          changed += ['vault/01 Current/Current Draft Board.md','vault/04 Positions/Defender.md',str(review),str(changes),'vault/01 Current/Current Watchlist.md','vault/Home.md','vault/Wiki.md']
          changelog=Path('vault/00 Meta/Document Changelog.md'); s=changelog.read_text()
          for f in changed+['vault/00 Meta/Document Changelog.md']:
              action='created' if f in [str(review),str(changes)] else 'updated'
              s+=f'\n| {TS} | `{f}` | {action} | Defender positional ranks 61–90 with challengers 56–60 and 91–95 | [[{REVIEW}]] | https://fantasy.premierleague.com/api/bootstrap-static/; https://fantasy.premierleague.com/api/fixtures/; [[{REVIEW}]]; [[{CHANGES}]] |'
          changelog.write_text(s+'\n')
          PY
          python /tmp/review.py
          python scripts/validate_draft_board.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Review defender positional ranks 61-90"
          git push origin HEAD:codex/fpl-review-20260804-0854-defender-61-90
