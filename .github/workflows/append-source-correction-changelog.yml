name: Append source correction changelog

on:
  push:
    branches:
      - codex/fpl-correction-20260801-1809-james-linden
    paths:
      - .github/workflows/append-source-correction-changelog.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-correction-20260801-1809-james-linden
      - name: Append audit entries
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('vault/00 Meta/Document Changelog.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'last_updated: 2026-08-01T17:38:00+10:00',
              'last_updated: 2026-08-01T18:09:00+10:00',
              1,
          )
          marker = '1809-AEST-source-name-correction.md` | Created'
          if marker not in text:
              text = text.rstrip() + '\n' + (
                  '| 2026-08-01T18:09:00+10:00 | `vault/05 Sources/X Source Graph.md` | Corrected | Corrected the Planet FPL host identity from James Richardson to James Linden and added source evidence and a correction backlink. | [[07 Changes/2026/08/2026-08-01/1809-AEST-source-name-correction]] | [Planet FPL on Apple Podcasts](https://podcasts.apple.com/au/podcast/planet-fpl-the-fantasy-football-podcast/id1280497332) |\n'
                  '| 2026-08-01T18:09:00+10:00 | `vault/07 Changes/2026/08/2026-08-01/1809-AEST-source-name-correction.md` | Created | Recorded the original source-name error, correction evidence and confirmation that no player ranking changed. | Self | [Planet FPL on Apple Podcasts](https://podcasts.apple.com/au/podcast/planet-fpl-the-fantasy-football-podcast/id1280497332) |\n'
                  '| 2026-08-01T18:09:00+10:00 | `vault/00 Meta/Document Changelog.md` | Updated | Recorded each Markdown document changed by the Planet FPL source-name correction. | [[07 Changes/2026/08/2026-08-01/1809-AEST-source-name-correction]] | Per-document audit |\n'
              )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit audit entries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "vault/00 Meta/Document Changelog.md"
          if git diff --cached --quiet; then
            echo "No changelog changes"
          else
            git commit -m "Record Planet FPL source-name correction"
            git push origin HEAD:codex/fpl-correction-20260801-1809-james-linden
          fi
