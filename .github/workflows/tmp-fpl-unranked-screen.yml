name: Temporary FPL unranked top-140 integration
on:
  pull_request:
    types: [synchronize, reopened]
permissions:
  contents: write
jobs:
  integrate:
    if: github.head_ref == 'codex/fpl-review-20260802-1009-unranked-top140-screen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1009-unranked-top140-screen
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fpl_screen_unranked_top140.py
      - run: |
          rm -f scripts/fpl_screen_unranked_top140.py tmp-unranked-candidates.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate omitted top-140 FPL candidates"
          git push origin HEAD:codex/fpl-review-20260802-1009-unranked-top140-screen
