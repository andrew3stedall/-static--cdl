name: Temporary sync FPL expansion branch
on:
  push:
    paths:
      - .github/workflows/tmp-sync-fpl-expand-branch.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-0904-expand-board
          fetch-depth: 0
      - name: Merge current main and retain cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit || true
          git rm -f --ignore-unmatch scripts/fpl_expand_to_240.py .github/workflows/tmp-fpl-220-plus-main-runner.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync expansion review with current main"
          elif git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Sync expansion review with current main"
          fi
          git push origin HEAD:codex/fpl-review-20260802-0904-expand-board
