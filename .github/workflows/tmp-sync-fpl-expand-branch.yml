name: Temporary regenerate FPL expansion sweep
on:
  pull_request:
    types: [synchronize, reopened]
permissions:
  contents: write
jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260802-0904-expand-board'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-0904-expand-board
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fpl_expand_to_240.py
      - run: |
          rm scripts/fpl_expand_to_240.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand FPL Draft board after full-pool sweep"
          git push origin HEAD:codex/fpl-review-20260802-0904-expand-board
