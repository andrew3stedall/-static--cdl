name: Finalize 2026-08-02 0800 changelog
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'codex/fpl-review-20260802-0800-morning-scan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-0800-morning-scan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/finalize_20260802_0800_changelog.py
      - run: |
          rm scripts/finalize_20260802_0800_changelog.py .github/workflows/finalize-20260802-0800-changelog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "vault/00 Meta/Document Changelog.md"
          git add -- scripts/finalize_20260802_0800_changelog.py .github/workflows/finalize-20260802-0800-changelog.yml
          git commit -m "Finalize 2 August morning review audit"
          git push origin HEAD:codex/fpl-review-20260802-0800-morning-scan
