name: Temporary FPL review 171-200
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260802-1201-ranks171-200'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1201-ranks171-200
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fpl_review_171_200.py
      - run: |
          rm scripts/fpl_review_171_200.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'vault' 'scripts/fpl_review_171_200.py'
          git commit -m "Review FPL Draft ranks 171-200"
          git push origin HEAD:codex/fpl-review-20260802-1201-ranks171-200
