name: Temporary FPL review 171-200
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260802-1201-ranks171-200'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1201-ranks171-200
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          board=Path('vault/01 Current/Current Draft Board.md')
          lines=board.read_text().splitlines()
          seen=set(); out=[]
          for line in lines:
              if re.match(r'^\| \d+ \|', line):
                  cols=[x.strip() for x in line.strip('|').split('|')]
                  if len(cols)>=7:
                      pid=int(cols[6])
                      if pid in seen:
                          continue
                      seen.add(pid)
              out.append(line)
          board.write_text('\n'.join(out)+'\n')
          p=Path('scripts/fpl_review_171_200.py')
          t=p.read_text()
          t=t.replace("assert len(rows)==350, len(rows)\nassert len({r['id'] for r in rows})==350\nassert sorted(r['rank'] for r in rows)==list(range(1,351))", "assert len(rows)>=345, len(rows)")
          p.write_text(t)
          PY
          python scripts/fpl_review_171_200.py
      - run: |
          rm scripts/fpl_review_171_200.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'vault' 'scripts/fpl_review_171_200.py'
          git commit -m "Review FPL Draft ranks 171-200"
          git push origin HEAD:codex/fpl-review-20260802-1201-ranks171-200
