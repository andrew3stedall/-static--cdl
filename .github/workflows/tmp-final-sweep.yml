name: Temporary Final Sweep
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  sweep:
    if: github.head_ref == 'codex/fpl-review-20260808-1650-final-sweep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260808-1650-final-sweep
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct goalkeeper tail
        run: |
          if git log -1 --pretty=%B | grep -q '^Apply final goalkeeper-tail correction$'; then exit 0; fi
          curl --retry 3 --retry-delay 2 -fsSL https://fantasy.premierleague.com/api/bootstrap-static/ -o /tmp/bootstrap.json
          python scripts/final_sweep_goalkeeper_correction.py
          python scripts/validate_draft_board.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply final goalkeeper-tail correction"
          git push origin HEAD:codex/fpl-review-20260808-1650-final-sweep
