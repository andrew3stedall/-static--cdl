name: Apply top-80 review on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_top80_source_review.py
      - .github/workflows/apply-top80-review-on-pr.yml

permissions:
  contents: write

jobs:
  apply-reviewed-order:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic top-80 review
        run: python scripts/apply_top80_source_review.py
      - name: Validate generated board
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          board = Path('vault/01 Current/Current Draft Board.md').read_text(encoding='utf-8')
          ids = [int(value) for value in re.findall(r'^\|\s*\d+\s*\|.*?\|\s*(\d+)\s*\|', board, flags=re.M)]
          assert len(ids) == 220, len(ids)
          assert len(set(ids)) == 220, len(set(ids))
          assert ids[79] == 261, ids[79]
          assert ids[159] == 63, ids[159]
          assert ids[219] == 139, ids[219]
          assert 121 not in ids, 'Mitoma phantom row retained'
          movement = json.loads(Path('vault/09 Data/2026-08-01-1848-top80-movements.json').read_text())
          assert movement['movement_count'] == 216, movement['movement_count']
          assert movement['entrants'] == [{'fpl_id': 70, 'new_rank': 28}], movement['entrants']
          assert movement['removed_from_board'] == [{'fpl_id': 441, 'old_rank': 220}], movement['removed_from_board']
          PY
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "vault/01 Current/Current Draft Board.md" \
            "vault/09 Data/2026-08-01-1848-official-api-snapshot.json" \
            "vault/09 Data/2026-08-01-1848-top80-movements.json"
          if git diff --cached --quiet; then
            echo "Generated files already correct"
          else
            git commit -m "Apply deterministic 1848 AEST top-80 board"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
