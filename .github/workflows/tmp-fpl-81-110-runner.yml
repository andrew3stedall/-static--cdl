name: Temporary FPL 81-110 runner
on:
  push:
    paths:
      - .github/workflows/tmp-fpl-81-110-runner.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-0815-ranks81-110
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/fpl_block_81_110.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete ranks 81-110 pairwise review"
          git push origin HEAD:codex/fpl-review-20260802-0815-ranks81-110
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          rm .github/workflows/tmp-fpl-81-110-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary FPL review runner"
          git push origin HEAD:main
