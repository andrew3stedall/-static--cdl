name: Temporary Brighton Team Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260802-2045-brighton-team'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-2045-brighton-team
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sed -i "s/'Mitoma','Groß'/'Mitoma','Welbeck','Groß'/" scripts/review_brighton_team.py
          sed -i "s/len(bha)==22/len(bha)==23/" scripts/review_brighton_team.py
          sed -i "s/of 22/of 23/g; s/All 22/All 23/g" scripts/review_brighton_team.py
          python scripts/review_brighton_team.py
          python scripts/validate_draft_board.py
          rm scripts/review_brighton_team.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Review Brighton internal draft ordering"
          git push origin HEAD:codex/fpl-review-20260802-2045-brighton-team
