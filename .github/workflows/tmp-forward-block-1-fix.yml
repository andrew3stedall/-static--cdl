name: Temporary Forward Block 1 Fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'codex/fpl-review-20260803-1648-forward-1-30'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260803-1648-forward-1-30
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python scripts/fix_forward_block_1.py
          python scripts/validate_draft_board.py
          rm scripts/fix_forward_block_1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct forward block review presentation"
          git push origin HEAD:codex/fpl-review-20260803-1648-forward-1-30
