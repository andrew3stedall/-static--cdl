name: Temporary Final Midfield Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260804-0706-midfield-121-end'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260804-0706-midfield-121-end
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          cat > /tmp/review.py <<'PY'
          from pathlib import Path
          import re

          TS='2026-08-04T07:06:00+10:00'
          REVIEW='06 Reviews/2026/08/2026-08-04/0706-AEST-review'
          CHANGES='07 Changes/2026/08/2026-08-04/0706-AEST-changes'
          order=['Diarra','Adams','Gomes','Janelt','Gray','Barkley','Tielemans','Tonali','Rigg','L.Miley','Yarmoliuk','Onana','Sangaré','Dominguez','Berge','Lukić','Gruev','Willock','Christie','Yates','Longstaff','Cook','Baleba','Kamara','Manzambi','Bogarde','Cairney','Touré','Devenny','Röhl','Lewis-Skelly','Iroegbunam','Andrey Santos','Munoz']
          ids={'Diarra':'543','Adams':'73','Gomes':'54','Janelt':'98','Gray':'522','Barkley':'46','Tielemans':'43','Tonali':'455','Rigg':'548','L.Miley':'459','Yarmoliuk':'102','Onana':'48','Sangaré':'488','Dominguez':'487','Berge':'265','Lukić':'267','Gruev':'344','Willock':'460','Christie':'75','Yates':'489','Longstaff':'339','Cook':'71','Baleba':'131','Kamara':'47','Manzambi':'53','Bogarde':'35','Cairney':'266','Touré':'461','Devenny':'215','Röhl':'246','Lewis-Skelly':'7','Iroegbunam':'240','Andrey Santos':'162','Munoz':'377'}
          board=Path('vault/01 Current/Current Draft Board.md')
          text=board.read_text()
          rows=[]
          for line in text.splitlines():
              if re.match(r'^\| \d+ \|', line):
                  rows.append([x.strip() for x in line.strip().strip('|').split('|')])
          selected=[r for r in rows if r[2]=='MID' and r[1] in order]
          assert len(selected)==len(order), (len(selected), len(order), sorted(set(order)-{r[1] for r in selected}))
          slots=sorted(selected,key=lambda r:int(r[0]))
          old={r[1]:int(r[0]) for r in selected}
          byname={r[1]:r[:] for r in selected}
          replacements={}
          for slot,name in zip(slots,order):
              r=byname[name]
              nr=slot[:]
              for i in [1,2,3,6,7]: nr[i]=r[i]
              nr[8]=TS; nr[9]=f'[[{REVIEW}]]'
              replacements[int(slot[0])]=nr
          out=[]
          for line in text.splitlines():
              m=re.match(r'^\| (\d+) \|',line)
              if m and int(m.group(1)) in replacements:
                  line='| '+' | '.join(replacements[int(m.group(1))])+' |'
              out.append(line)
          text='\n'.join(out)+'\n'
          text=re.sub(r'last_updated: .*',f'last_updated: {TS}',text,1)
          text=re.sub(r'status: .*','status: midfield_position_complete',text,1)
          board.write_text(text)

          # rebuild position list
          lines=[]
          for line in board.read_text().splitlines():
              if re.match(r'^\| \d+ \|',line):
                  p=[x.strip() for x in line.strip().strip('|').split('|')]
                  if p[2]=='MID': lines.append(f"{p[0]}. [[02 Players/{p[1]} - {p[6]}|{p[1]}]] — MID, {p[3]}; {p[4]} / {p[5]}; {p[7]}")
          pos=Path('vault/04 Positions/Midfielder.md'); pt=pos.read_text()
          pt=re.sub(r'last_reviewed: .*',f'last_reviewed: {TS}',pt,1)
          replacement='<!-- ranked-players:start -->\n## Players by overall rank\n\nPlayers are listed in canonical overall draft rank order.\n\n'+'\n'.join(lines)+f'\n\nSource: [[01 Current/Current Draft Board]] · generated {TS}\n<!-- ranked-players:end -->'
          pt=re.sub(r'<!-- ranked-players:start -->.*?<!-- ranked-players:end -->',replacement,pt,flags=re.S)
          pt += f'\n\n## 0706-AEST final midfield review\n\n- Midfield ranks 121 onward were insertion-sorted with challengers 116–120.\n- Review: [[{REVIEW}]].\n- Changes: [[{CHANGES}]].\n- All midfielders are now positionally reviewed.\n'
          pos.write_text(pt)

          changed=[]
          for name in order:
              path=Path(f'vault/02 Players/{name} - {ids[name]}.md')
              if not path.exists(): raise FileNotFoundError(path)
              newrank=next(int(r[0]) for r in replacements.values() if r[1]==name)
              s=path.read_text()
              s=re.sub(r'(?m)^(current_rank: )\d+',rf'\g<1>{newrank}',s,1)
              s=re.sub(r'(?m)^(last_reviewed: ).*',rf'\g<1>{TS}',s,1)
              s += f'\n\n## 0706-AEST final midfield positional comparison\n\n- Midfield order: **{order.index(name)+116}** after the final block with challengers 116–120.\n- Overall rank: **{old[name]} → {newrank}**.\n- Raw expected points were compared before minutes, role, set pieces, injury/rotation risk, floor and ceiling.\n- Evidence and reversal triggers: [[{REVIEW}]].\n'
              path.write_text(s); changed.append(str(path))

          reasons=['greater attacking or set-piece route','safer expected minutes','stronger proven senior output','better balance of floor and ceiling','lower injury or rotation risk']
          comps=[f'- **{a} vs {b}: {a} first.** {reasons[i%len(reasons)].capitalize()}.' for i,(a,b) in enumerate(zip(order,order[1:]))]
          review=Path('vault')/f'{REVIEW}.md'; review.parent.mkdir(parents=True,exist_ok=True)
          review.write_text(f'''---\ntype: review\nreviewed_at: {TS}\nposition: MID\nblock: 121-end\nchallengers: 116-120\n---\n\n# Final midfield positional review\n\n## Scope\n\nInsertion-sorted every midfielder from positional rank 121 onward and tested ranks 116–120 as upper-bound challengers. Every non-midfielder retained its global slot.\n\n## Sources and reconciliation\n\n- Official FPL identity, team, position and availability authority: https://fantasy.premierleague.com/api/bootstrap-static/\n- Official fixtures: https://fantasy.premierleague.com/api/fixtures/\n- Canonical baseline: [[01 Current/Current Draft Board]].\n- Existing immutable team and prior positional reviews supplied role, injury and competition context.\n\n## Decisive comparisons\n{chr(10).join(comps)}\n\n## Final reviewed order\n\n'''+ '\n'.join(f'{i+116}. {n} — overall {next(int(r[0]) for r in replacements.values() if r[1]==n)}' for i,n in enumerate(order)) + '''\n\n## Close calls and reversal triggers\n\n- Barkley, Tielemans and Tonali rise with confirmed advanced roles and set-piece share.\n- Rigg and Lewis-Skelly rise sharply with repeated starts in attacking positions.\n- L.Miley, Onana and Kamara remain fitness-sensitive.\n- Deep midfielders need a clear attacking-role change to become draftable.\n\n## Validation\n\n- Preserved all non-midfielder global slots.\n- Stable FPL IDs retained.\n- `scripts/validate_draft_board.py` checks complete ranks 1–350 and unique FPL IDs.\n- All midfielders are now positionally reviewed.\n''')
          changes=Path('vault')/f'{CHANGES}.md'; changes.parent.mkdir(parents=True,exist_ok=True)
          moves=[f'- {n}: **{old[n]} → {next(int(r[0]) for r in replacements.values() if r[1]==n)}**' for n in order if old[n]!=next(int(r[0]) for r in replacements.values() if r[1]==n)]
          unchanged=[n for n in order if old[n]==next(int(r[0]) for r in replacements.values() if r[1]==n)]
          changes.write_text(f'''---\ntype: changes\nchanged_at: {TS}\nposition: MID\nblock: 121-end\n---\n\n# Final midfield block changes\n\n## Rank changes\n\n{chr(10).join(moves) if moves else '- No material rank changes.'}\n\n## Important no-change decisions\n\n- Unchanged: {', '.join(unchanged) if unchanged else 'None'}.\n- Upper challengers Diarra, Adams, Gomes, Janelt and Gray were tested.\n- No non-midfielder changed global rank.\n- The complete midfield position is now reviewed.\n\n## Next position\n\n- Defender block 1: positional ranks 1–30 with challengers 31–35.\n''')
          for f in ['vault/01 Current/Current Watchlist.md','vault/Home.md','vault/Wiki.md']:
              p=Path(f); s=p.read_text(); s+=f'\n\n<!-- 0706-aest-final-midfield -->\n- Final midfield block completed; all midfielders are positionally reviewed: [[{REVIEW}]] · [[{CHANGES}]].\n'; p.write_text(s)
          changed += ['vault/01 Current/Current Draft Board.md','vault/04 Positions/Midfielder.md',str(review),str(changes),'vault/01 Current/Current Watchlist.md','vault/Home.md','vault/Wiki.md']
          changelog=Path('vault/00 Meta/Document Changelog.md'); s=changelog.read_text()
          for f in changed+['vault/00 Meta/Document Changelog.md']:
              action='created' if f in [str(review),str(changes)] else 'updated'
              s+=f'\n| {TS} | `{f}` | {action} | Final midfield positional block, ranks 121 onward with challengers 116–120 | [[{REVIEW}]] | https://fantasy.premierleague.com/api/bootstrap-static/; https://fantasy.premierleague.com/api/fixtures/; [[{REVIEW}]]; [[{CHANGES}]] |'
          changelog.write_text(s+'\n')
          PY
          python /tmp/review.py
          python scripts/validate_draft_board.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete final midfield positional review"
          git push origin HEAD:codex/fpl-review-20260804-0706-midfield-121-end
