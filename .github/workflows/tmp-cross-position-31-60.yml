name: Temporary Cross Position 31-60 Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260804-2041-cross-position-31-60'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260804-2041-cross-position-31-60
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          curl -fsSL https://fantasy.premierleague.com/api/bootstrap-static/ -o /tmp/bootstrap.json
          curl -fsSL https://fantasy.premierleague.com/api/fixtures/ -o /tmp/fixtures.json
          status=$(curl -L -sS -o /tmp/premier-injuries.html -w '%{http_code}' https://www.premierinjuries.com/injury-table.php || true)
          echo "$status" > /tmp/premier-injuries-status.txt
          cat > /tmp/review.py <<'PY'
          from pathlib import Path
          import json,re

          TS='2026-08-04T20:41:00+10:00'
          REVIEW='06 Reviews/2026/08/2026-08-04/2041-AEST-review'
          CHANGES='07 Changes/2026/08/2026-08-04/2041-AEST-changes'
          order=['Solanke','Pedro Porro','Cherki','Bruno G.','Rice','O.Dango','Muñoz','Marmoush','Dewsbury-Hall','Calvert-Lewin','Ndiaye','Schade','Kudus','Doku','E.Le Fée','Enzo','Virgil','Gvardiol','Maddison','Sarr','Frimpong','Minteh','Evanilson','Šeško','Martinelli','Wissa','Neto','Amad','Barnes','McNeil','Kerkez','James','Rashford','Woltemade','Wood','Richarlison','Tel','Savinho','Estêvão','Mitoma']

          board=Path('vault/01 Current/Current Draft Board.md')
          text=board.read_text()
          rows=[]
          for line in text.splitlines():
              if re.match(r'^\| \d+ \|',line):
                  rows.append([x.strip() for x in line.strip().strip('|').split('|')])
          selected=[r for r in rows if 26<=int(r[0])<=65]
          assert len(selected)==40
          assert set(r[1] for r in selected)==set(order)
          old={r[1]:int(r[0]) for r in selected}; by={r[1]:r[:] for r in selected}

          bootstrap=json.loads(Path('/tmp/bootstrap.json').read_text())
          api_ids={int(p['id']) for p in bootstrap['elements']}
          for r in selected:
              assert int(r[6]) in api_ids, (r[1],r[6])
          fixtures=json.loads(Path('/tmp/fixtures.json').read_text())
          assert isinstance(fixtures,list)
          pi_status=Path('/tmp/premier-injuries-status.txt').read_text().strip()

          def segment(rank):
              return 'Foundation' if rank<=32 else 'Core'
          def tier(rank):
              return 'B+' if rank<=32 else 'B' if rank<=48 else 'B-'

          repl={}
          for rank,name in enumerate(order,26):
              r=by[name][:]
              r[0]=str(rank); r[4]=segment(rank); r[5]=tier(rank); r[8]=TS; r[9]=f'[[{REVIEW}]]'
              repl[rank]=r
          out=[]
          for line in text.splitlines():
              m=re.match(r'^\| (\d+) \|',line)
              if m and int(m.group(1)) in repl:
                  line='| '+' | '.join(repl[int(m.group(1))])+' |'
              out.append(line)
          text='\n'.join(out)+'\n'
          text=re.sub(r'last_updated: .*',f'last_updated: {TS}',text,1)
          text=re.sub(r'status: .*','status: cross_position_block_2_reviewed',text,1)
          board.write_text(text)

          changed=[]
          for rank,name in enumerate(order,26):
              r=by[name]; fid=r[6]; path=Path(f'vault/02 Players/{name} - {fid}.md')
              if not path.exists(): raise FileNotFoundError(path)
              p=path.read_text()
              p=re.sub(r'(?m)^(current_rank: )\d+',rf'\g<1>{rank}',p,1)
              p=re.sub(r'(?m)^(last_reviewed: ).*',rf'\g<1>{TS}',p,1)
              p+=f'\n\n## 2041-AEST cross-position comparison\n\n- Reviewed in the overall 31–60 block with challengers 26–30 and 61–65.\n- Overall rank: **{old[name]} → {rank}**.\n- Raw expected season points were considered before minutes, role, set pieces, floor/ceiling and positional replacement value.\n- Injury weighting used the full Draft season: short absences were minor, while uncertain or multi-month cases remained material.\n- Evidence and reversal triggers: [[{REVIEW}]].\n'
              path.write_text(p); changed.append(str(path))

          # Rebuild all positional ranked lists because cross-position movement changes their overall-rank displays.
          pos_paths={'FWD':'vault/04 Positions/Forward.md','MID':'vault/04 Positions/Midfielder.md','DEF':'vault/04 Positions/Defender.md','GKP':'vault/04 Positions/Goalkeeper.md'}
          current=[]
          for line in board.read_text().splitlines():
              if re.match(r'^\| \d+ \|',line): current.append([x.strip() for x in line.strip().strip('|').split('|')])
          for code,path_str in pos_paths.items():
              path=Path(path_str); s=path.read_text(); lines=[]
              for p in current:
                  if p[2]==code:
                      lines.append(f"{p[0]}. [[02 Players/{p[1]} - {p[6]}|{p[1]}]] — {code}, {p[3]}; {p[4]} / {p[5]}; {p[7]}")
              replacement='<!-- ranked-players:start -->\n## Players by overall rank\n\nPlayers are listed in canonical overall draft rank order.\n\n'+'\n'.join(lines)+f'\n\nSource: [[01 Current/Current Draft Board]] · generated {TS}\n<!-- ranked-players:end -->'
              s=re.sub(r'<!-- ranked-players:start -->.*?<!-- ranked-players:end -->',replacement,s,flags=re.S)
              s=re.sub(r'last_reviewed: .*',f'last_reviewed: {TS}',s,1)
              path.write_text(s); changed.append(path_str)

          reasons={
            ('Muñoz','Marmoush'):'Muñoz retains elite attacking-defender scarcity, but Marmoush has the stronger raw goal ceiling.',
            ('Marmoush','Dewsbury-Hall'):'Marmoush has the higher season-long scoring ceiling despite rotation risk.',
            ('Dewsbury-Hall','Calvert-Lewin'):'Dewsbury-Hall has the safer all-season minutes and creative floor; Calvert-Lewin has the scarcer striker role.',
            ('Schade','Kudus'):'Schade has the cleaner current availability, but the call is close because Kudus has the better season-long ceiling.',
            ('Kudus','Doku'):'Kudus is preferred over the full season; the current thigh flag is only a small discount unless the absence lengthens.',
            ('Gvardiol','Maddison'):'Gvardiol has a stronger defensive floor and scarcity case; Maddison has the higher creative ceiling.',
            ('Frimpong','Minteh'):'Frimpong’s attacking defender role and scarcity narrowly beat Minteh’s raw attacking upside.',
            ('Evanilson','Šeško'):'Evanilson has the safer current minutes; Šeško’s short shin issue is only a small Draft penalty and a confirmed starting role could reverse them.',
            ('Kerkez','James'):'Kerkez has the safer durability profile; James retains the higher per-start ceiling.',
            ('Estêvão','Mitoma'):'Estêvão’s uncertain minutes still beat an unknown-return hamstring case; a credible Mitoma return date would reverse this quickly.'
          }
          comps=[]
          for a,b in zip(order,order[1:]):
              why=reasons.get((a,b),'The player above had the better season-long combination of expected points, minutes, role, floor and draft replacement value.')
              comps.append(f'- **{a} vs {b}: {a} first.** {why} Confidence: medium; reverse for a material role, minutes, set-piece or long-term availability change.')

          review=Path('vault')/f'{REVIEW}.md'; review.parent.mkdir(parents=True,exist_ok=True)
          review.write_text(f'''---\ntype: review\nreviewed_at: {TS}\nscope: cross-position ranks 31-60\nchallengers: 26-30 and 61-65\n---\n\n# Cross-position review — overall ranks 31–60\n\n## Changes since prior iteration\n\nThe first cross-position block established ranks 1–30 and the Draft-horizon injury policy. This run insertion-sorted ranks 31–60 against five challengers on both boundaries.\n\n## API reconciliation\n\n- Official FPL bootstrap was fetched successfully and every reviewed stable FPL ID was present.\n- Official fixtures endpoint was fetched successfully.\n- Forty players occupied the expected ranks 26–65 before sorting; no API-pool removal was detected in this block.\n\n## Injury evidence\n\n- Premier Injuries request returned HTTP **{pi_status}**. No return date was adopted unless supported by canonical FPL metadata or existing cited club evidence.\n- Kudus and Šeško were not materially punished for short-probability flags because this is a season-long Draft board.\n- Mitoma remained discounted because the canonical status has an unknown return date, which is materially different from a verified one-month absence.\n\n## Decisive pairwise comparisons\n{chr(10).join(comps)}\n\n## Final reviewed order\n\n'''+ '\n'.join(f'{i}. {n}' for i,n in enumerate(order,26)) + '''\n\n## Key trade-offs\n\n- Marmoush moved upward because his scoring ceiling was too low relative to lower-upside midfielders, while rotation risk still kept him outside the top 32.\n- Kudus moved materially upward; a short thigh issue should not erase his season-long attacking role.\n- Frimpong stayed ahead of Minteh after defender scarcity was applied only after raw expected points.\n- Šeško moved above several mids because a short injury flag is a small Draft penalty and the central-forward ceiling is scarce.\n- Mitoma fell to the lower boundary because an unknown return date deserves more caution than a verified short absence.\n\n## Evidence rejected or not adopted\n\n- No price, ownership or classic-FPL transfer convenience was used.\n- No exact Premier Injuries return date was adopted from an inaccessible or non-200 response.\n- No player was promoted solely on speculative preseason output.\n\n## Next triggers\n\n- Confirmed Kudus or Šeško return timelines.\n- A credible Mitoma return date.\n- Starting-role clarity for Marmoush, Doku, Savinho and Estêvão.\n- Next block: overall ranks 61–90 with challengers 56–60 and 91–95.\n\n## Validation\n\n- Stable FPL IDs retained.\n- Ranks 1–350 remain complete and unique.\n- All ranks outside 26–65 retained their occupants.\n''')

          changes=Path('vault')/f'{CHANGES}.md'; changes.parent.mkdir(parents=True,exist_ok=True)
          moves=[f'- {n}: **{old[n]} → {i}**' for i,n in enumerate(order,26) if old[n]!=i]
          unchanged=[n for i,n in enumerate(order,26) if old[n]==i]
          changes.write_text(f'''---\ntype: changes\nchanged_at: {TS}\nscope: cross-position ranks 31-60\n---\n\n# Cross-position block 2 changes\n\n## Rank changes\n\n{chr(10).join(moves) if moves else '- No material rank changes.'}\n\n## Important no-change decisions\n\n- Unchanged: {', '.join(unchanged) if unchanged else 'None'}.\n- No player outside ranks 26–65 changed global rank.\n- Kudus and Šeško did not receive large short-term injury downgrades.\n- Mitoma remained materially discounted because the return date is unknown.\n\n## Next block\n\n- Overall ranks 61–90 with challengers 56–60 and 91–95.\n''')

          for f in ['vault/01 Current/Current Watchlist.md','vault/Home.md','vault/Wiki.md']:
              p=Path(f); q=p.read_text(); q+=f'\n\n<!-- 2041-aest-cross-position-31-60 -->\n- Cross-position ranks 31–60 reviewed with challengers 26–30 and 61–65: [[{REVIEW}]] · [[{CHANGES}]].\n'; p.write_text(q)
          changed += ['vault/01 Current/Current Draft Board.md',str(review),str(changes),'vault/01 Current/Current Watchlist.md','vault/Home.md','vault/Wiki.md']
          changelog=Path('vault/00 Meta/Document Changelog.md'); c=changelog.read_text()
          evidence=f'https://fantasy.premierleague.com/api/bootstrap-static/; https://fantasy.premierleague.com/api/fixtures/; https://www.premierinjuries.com/injury-table.php (HTTP {pi_status}; no unsupported dates adopted); [[{REVIEW}]]; [[{CHANGES}]]'
          for f in changed+['vault/00 Meta/Document Changelog.md']:
              action='created' if f in [str(review),str(changes)] else 'updated'
              c+=f'\n| {TS} | `{f}` | {action} | Cross-position ranks 31–60 with five-player boundary challengers | [[{REVIEW}]] | {evidence} |'
          changelog.write_text(c+'\n')
          PY
          python /tmp/review.py
          python scripts/validate_draft_board.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Review cross-position ranks 31-60"
          git push origin HEAD:codex/fpl-review-20260804-2041-cross-position-31-60
