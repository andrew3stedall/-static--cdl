name: One-off ranks 17-32 pairwise review

on:
  push:
    branches:
      - codex/fpl-review-20260801-2243-ranks17-32
    paths:
      - scripts/apply_pairwise_17_32.py
      - .github/workflows/one-off-ranks17-32.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260801-2243-ranks17-32
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_pairwise_17_32.py
      - name: Remove one-off helpers
        run: rm scripts/apply_pairwise_17_32.py .github/workflows/one-off-ranks17-32.yml
      - name: Commit generated review
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Pairwise-sort FPL Draft ranks 17-32"
          git push
