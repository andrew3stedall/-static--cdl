name: Temporary fix FPL 350 changelog
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  fix:
    if: github.head_ref == 'codex/fpl-review-20260802-1017-expand-350'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1017-expand-350
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base='b63c2f4c347cf1256fd50e2f2effaac3e205b63c'
          added=[]
          for line in subprocess.check_output(['git','diff','--name-status',base,'HEAD'],text=True).splitlines():
              parts=line.split('\t')
              if parts[0]=='A' and len(parts)>1 and parts[1].startswith('vault/02 Players/') and parts[1].endswith('.md'):
                  added.append(parts[1])
          p=Path('vault/00 Meta/Document Changelog.md'); t=p.read_text()
          for path in added:
              old=f'| 2026-08-02T10:17:00+10:00 | `{path}` | Updated |'
              new=f'| 2026-08-02T10:17:00+10:00 | `{path}` | Created |'
              t=t.replace(old,new)
          p.write_text(t)
          print({'created_labels_fixed':len(added)})
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'vault/00 Meta/Document Changelog.md'
          git commit -m "Correct 350-player changelog action labels"
          git push origin HEAD:codex/fpl-review-20260802-1017-expand-350
