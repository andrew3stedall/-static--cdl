name: Temporary sync FPL expand 350
on:
  push:
    paths:
      - .github/workflows/tmp-sync-expand-350.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1017-expand-350
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main -s ours -m "Sync 350-player expansion with current main"
          git push origin HEAD:codex/fpl-review-20260802-1017-expand-350
