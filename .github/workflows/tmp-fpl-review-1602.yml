name: Temporary FPL review 1602

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  review:
    if: github.head_ref == 'codex/fpl-review-20260802-1602-ranks141-170-recheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1602-ranks141-170-recheck
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python scripts/run_fpl_review_1602.py
          python scripts/validate_draft_board.py
      - run: |
          rm scripts/run_fpl_review_1602.py
          rm .github/workflows/tmp-fpl-review-1602.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'vault/00 Meta/Document Changelog.md' \
            'vault/01 Current/Current Draft Board.md' \
            'vault/01 Current/Current Watchlist.md' \
            'vault/02 Players' \
            'vault/05 Sources/Reuters.md' \
            'vault/06 Reviews/2026/08/2026-08-02/1602-AEST-review.md' \
            'vault/07 Changes/2026/08/2026-08-02/1602-AEST-changes.md' \
            'vault/Wiki.md' \
            'vault/Home.md' \
            'scripts/run_fpl_review_1602.py' \
            '.github/workflows/tmp-fpl-review-1602.yml'
          git commit -m "Review FPL Draft ranks 141-170 at 1602 AEST"
          git push origin HEAD:codex/fpl-review-20260802-1602-ranks141-170-recheck
