name: Temporary FPL 0848 changelog fix
on:
  pull_request:
    types: [synchronize, reopened]
permissions:
  contents: write
jobs:
  fix:
    if: github.head_ref == 'codex/fpl-review-20260802-0848-ranks201-220'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-0848-ranks201-220
          fetch-depth: 0
      - name: Apply correction when present
        run: |
          if [ -f scripts/fix_0848_changelog_actions.py ]; then
            python scripts/fix_0848_changelog_actions.py
            rm scripts/fix_0848_changelog_actions.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Correct 0848 changelog action labels"
            git push origin HEAD:codex/fpl-review-20260802-0848-ranks201-220
          fi
