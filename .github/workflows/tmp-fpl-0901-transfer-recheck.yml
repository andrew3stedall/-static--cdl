name: Temporary FPL 0901 transfer recheck
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260802-0901-transfer-recheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-0901-transfer-recheck
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate review
        run: python scripts/fpl_review_0901_transfer_recheck.py
      - name: Commit review
        run: |
          rm scripts/fpl_review_0901_transfer_recheck.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- vault
          git add -- scripts/fpl_review_0901_transfer_recheck.py
          git commit -m "Complete 0901 transfer-driven FPL review"
          git push origin HEAD:codex/fpl-review-20260802-0901-transfer-recheck
