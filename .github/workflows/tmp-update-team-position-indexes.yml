name: Temporary Team Position Index Refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260802-1810-refresh-team-position'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1810-refresh-team-position
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python scripts/update_team_position_indexes.py
          python scripts/validate_draft_board.py
          rm scripts/update_team_position_indexes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh team and position player indexes"
          git push origin HEAD:codex/fpl-review-20260802-1810-refresh-team-position
