name: Temporary FPL Review 1400
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260802-1400-ranks81-110-recheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-1400-ranks81-110-recheck
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/run_fpl_review_1400.py
      - run: |
          rm scripts/run_fpl_review_1400.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'vault/01 Current/Current Draft Board.md' 'vault/01 Current/Current Watchlist.md' 'vault/02 Players' 'vault/06 Reviews/2026/08/2026-08-02/1400-AEST-review.md' 'vault/07 Changes/2026/08/2026-08-02/1400-AEST-changes.md' 'vault/00 Meta/Document Changelog.md' 'vault/Wiki.md' 'vault/Home.md' scripts/run_fpl_review_1400.py
          git commit -m "Recheck FPL Draft ranks 81-110"
          git push origin HEAD:codex/fpl-review-20260802-1400-ranks81-110-recheck
