name: Append 1848 review changelog

on:
  push:
    branches:
      - codex/fpl-review-20260801-1848-top80-source-correction
    paths:
      - .github/workflows/append-1848-review-changelog.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260801-1848-top80-source-correction
      - name: Append audit entries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('vault/00 Meta/Document Changelog.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'last_updated: 2026-08-01T18:09:00+10:00',
              'last_updated: 2026-08-01T18:48:00+10:00',
              1,
          )
          review = '[[06 Reviews/2026/08/2026-08-01/1848-AEST-review]]'
          changes = '[[07 Changes/2026/08/2026-08-01/1848-AEST-changes]]'
          entries = [
              ('scripts/apply_top80_source_review.py', 'Created', 'Added reproducible official-ID top-80 correction, API refresh and movement export.', '[FPL bootstrap](https://fantasy.premierleague.com/api/bootstrap-static/)'),
              ('vault/01 Current/Current Draft Board.md', 'Updated', 'Replaced the prior-points-biased top 80 with the source-corrected order while retaining 220 rows.', '[Waiver FPL board disclosure](https://waiverfpl.com/draft)'),
              ('vault/01 Current/Current Watchlist.md', 'Updated', 'Replaced the resolved top-80 quality item with current rotation, injury, role, transfer and ranks 81-160 uncertainties.', review),
              ('vault/02 Players/Haaland - 411.md', 'Created', 'Added current rank, role, risks and evidence timeline for the first overall player.', '[PL analysis](https://www.premierleague.com/en/news/4680821/the-scouts-analysis-of-15-key-player-prices-in-202627-fantasy)'),
              ('vault/02 Players/B.Fernandes - 426.md', 'Created', 'Added current rank, role, set-piece evidence and fixture context.', '[PL expert panel](https://www.premierleague.com/en/news/4672877/fpl-experts-price-predictions-for-202627)'),
              ('vault/02 Players/Saka - 12.md', 'Created', 'Added the evidence and reasoning for the rise from 11 to 3.', '[PL Saka analysis](https://www.premierleague.com/en/news/4650977/just-how-important-is-saka-to-arsenal)'),
              ('vault/02 Players/Isak - 379.md', 'Created', 'Added the evidence and risks behind the rise from 96 to 4.', '[PL analysis](https://www.premierleague.com/en/news/4680821/the-scouts-analysis-of-15-key-player-prices-in-202627-fantasy)'),
              ('vault/02 Players/Thiago - 106.md', 'Created', 'Added role, penalties, production and dissenting-source treatment.', '[PL expert panel](https://www.premierleague.com/en/news/4672877/fpl-experts-price-predictions-for-202627)'),
              ('vault/02 Players/Palmer - 154.md', 'Created', 'Added the ceiling and workload case behind the rise from 35 to 6.', '[PL analysis](https://www.premierleague.com/en/news/4680821/the-scouts-analysis-of-15-key-player-prices-in-202627-fantasy)'),
              ('vault/02 Players/Gabriel - 4.md', 'Created', 'Added the cross-position reason for moving from 3 to 8 while retaining first-round status.', '[PL analysis](https://www.premierleague.com/en/news/4680821/the-scouts-analysis-of-15-key-player-prices-in-202627-fantasy)'),
              ('vault/02 Players/Wirtz - 366.md', 'Created', 'Added post-Salah role and preseason evidence behind the rise from 77 to 15.', '[PL expert panel](https://www.premierleague.com/en/news/4672877/fpl-experts-price-predictions-for-202627)'),
              ('vault/02 Players/Mbeumo - 427.md', 'Created', 'Added fixture and team-role evidence behind the rise from 29 to 11.', '[PL FDR](https://www.premierleague.com/en/news/4675493/get-the-fixture-difficulty-ratings-for-202627-fpl-season)'),
              ('vault/02 Players/Cunha - 428.md', 'Created', 'Added fixture and late-season role evidence behind the rise from 38 to 12.', '[PL early selection](https://www.premierleague.com/en/news/4681112/early-scout-selection-the-best-fantasy-squad-for-202627)'),
              ('vault/03 Teams/MCI.md', 'Created', 'Added City player anchors and attack/defence rotation risks.', '[FPL bootstrap](https://fantasy.premierleague.com/api/bootstrap-static/)'),
              ('vault/03 Teams/MUN.md', 'Created', 'Added United player anchors and favourable opening-fixture context.', '[PL FDR](https://www.premierleague.com/en/news/4675493/get-the-fixture-difficulty-ratings-for-202627-fpl-season)'),
              ('vault/03 Teams/ARS.md', 'Created', 'Added Arsenal player anchors, attack hierarchy and defender injury risks.', '[PL Saka analysis](https://www.premierleague.com/en/news/4650977/just-how-important-is-saka-to-arsenal)'),
              ('vault/03 Teams/LIV.md', 'Created', 'Added Liverpool player anchors, post-Salah roles and defensive injuries.', '[PL analysis](https://www.premierleague.com/en/news/4680821/the-scouts-analysis-of-15-key-player-prices-in-202627-fantasy)'),
              ('vault/03 Teams/CHE.md', 'Created', 'Added Chelsea player anchors and attacking-hierarchy uncertainty.', '[Reuters](https://www.reuters.com/sports/soccer/rogers-palmer-combination-key-chelsea-revival-says-alonso-2026-07-27/)'),
              ('vault/03 Teams/BRE.md', 'Created', 'Added Brentford player anchors and Thiago evidence.', '[PL expert panel](https://www.premierleague.com/en/news/4672877/fpl-experts-price-predictions-for-202627)'),
              ('vault/04 Positions/Forward.md', 'Created', 'Added current forward scarcity, leaders and risks.', '[[04 Positions/2026-27 Top-80 Correction]]'),
              ('vault/04 Positions/Midfielder.md', 'Created', 'Added current midfield depth, elite-role distinction and leaders.', '[[04 Positions/2026-27 Top-80 Correction]]'),
              ('vault/04 Positions/Defender.md', 'Created', 'Added defensive-contribution treatment, leaders and role risks.', '[[04 Positions/2026-27 Top-80 Correction]]'),
              ('vault/04 Positions/Goalkeeper.md', 'Created', 'Added goalkeeper replacement-depth strategy and current leaders.', '[[04 Positions/2026-27 Top-80 Correction]]'),
              ('vault/04 Positions/2026-27 Top-80 Correction.md', 'Created', 'Documented the cross-position method correction and round guidance.', '[Waiver FPL board disclosure](https://waiverfpl.com/draft)'),
              ('vault/05 Sources/X Source Graph.md', 'Updated', 'Expanded the graph through official-panel analysts and recorded this run’s X access limitations and no-change findings.', '[PL expert panel](https://www.premierleague.com/en/news/4672877/fpl-experts-price-predictions-for-202627)'),
              ('vault/05 Sources/Official FPL Expert Panel.md', 'Created', 'Added a structured source-network note for the official curated expert panel.', '[PL expert panel](https://www.premierleague.com/en/news/4672877/fpl-experts-price-predictions-for-202627)'),
              ('vault/06 Reviews/2026/08/2026-08-01/1848-AEST-review.md', 'Created', 'Captured the complete second review, evidence, rejected conclusions, methodology and next priorities.', 'Self'),
              ('vault/07 Changes/2026/08/2026-08-01/1848-AEST-changes.md', 'Created', 'Recorded material old/new ranks, source-network changes, injury validation and unchanged conclusions.', review),
              ('vault/09 Data/2026-08-01-1848-official-api-snapshot.json', 'Created', 'Stored the official player/team/fixture counts and reviewed-ID validation.', '[FPL bootstrap](https://fantasy.premierleague.com/api/bootstrap-static/)'),
              ('vault/09 Data/2026-08-01-1848-top80-movements.json', 'Created', 'Stored machine-readable old/new rank movements for all mechanically affected rows.', changes),
              ('vault/Wiki.md', 'Updated', 'Updated the durable summary, top tier, method, source network and active uncertainties.', review),
              ('vault/Home.md', 'Updated', 'Updated latest-run navigation and added player, team, position and source entry points.', review),
              ('vault/00 Meta/Document Changelog.md', 'Updated', 'Recorded every file created or changed by the second review.', 'Per-document audit'),
          ]
          marker = '`vault/06 Reviews/2026/08/2026-08-01/1848-AEST-review.md` | Created'
          if marker not in text:
              rows = []
              for document, action, summary, evidence in entries:
                  rows.append(
                      f'| 2026-08-01T18:48:00+10:00 | `{document}` | {action} | {summary} | {review} | {evidence} |'
                  )
              text = text.rstrip() + '\n' + '\n'.join(rows) + '\n'
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit document audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "vault/00 Meta/Document Changelog.md"
          if git diff --cached --quiet; then
            echo "No changelog changes"
          else
            git commit -m "Record 1848 AEST review document audit"
            git push origin HEAD:codex/fpl-review-20260801-1848-top80-source-correction
          fi
