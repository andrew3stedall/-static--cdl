name: Temporary Midfield Block 3 Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260803-2316-midfield-61-90'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260803-2316-midfield-61-90
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python scripts/review_midfield_block_3.py
          python scripts/validate_draft_board.py
          rm scripts/review_midfield_block_3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Review midfield positional ranks 61-90"
          git push origin HEAD:codex/fpl-review-20260803-2316-midfield-61-90
