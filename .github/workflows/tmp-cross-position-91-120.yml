name: Temporary Cross Position 91-120 Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260804-2351-cross-position-91-120'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260804-2351-cross-position-91-120
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          curl -fsSL https://fantasy.premierleague.com/api/bootstrap-static/ -o /tmp/bootstrap.json
          curl -fsSL https://fantasy.premierleague.com/api/fixtures/ -o /tmp/fixtures.json
          status=$(curl -L -sS -o /tmp/pi.html -w '%{http_code}' https://www.premierinjuries.com/injury-table.php || true)
          echo "$status" >/tmp/pi-status
          cat >/tmp/run.py <<'PY'
          from pathlib import Path
          import json,re
          TS='2026-08-04T23:51:00+10:00'; R='06 Reviews/2026/08/2026-08-04/2351-AEST-review'; C='07 Changes/2026/08/2026-08-04/2351-AEST-changes'
          order=['Hall','Rayan','Beto','Xhaka','Nketiah','Aït-Nouri','Reijnders','Okafor','Groß','Calafiori','Garnacho','Mac Allister','Truffert','Stach','Fernandes','Mitchell','Tete','Van de Ven','Anderson','Jensen','Igor Jesus','Welbeck','Robinson','Collins','McGinn','Chalobah','Livramento','Pickford','Henderson','Pope','Vicario','Ndoye','Lewis-Potter','Gusto',"O'Reilly",'Rúben','Romero','A.Becker','Kelleher','Aaronson']
          board=Path('vault/01 Current/Current Draft Board.md'); txt=board.read_text(); rows=[]
          for l in txt.splitlines():
              if re.match(r'^\| \d+ \|',l): rows.append([x.strip() for x in l.strip().strip('|').split('|')])
          sel=[r for r in rows if 86<=int(r[0])<=125]; assert len(sel)==40 and set(r[1] for r in sel)==set(order)
          api={int(p['id']) for p in json.loads(Path('/tmp/bootstrap.json').read_text())['elements']}; assert all(int(r[6]) in api for r in sel); assert isinstance(json.loads(Path('/tmp/fixtures.json').read_text()),list)
          old={r[1]:int(r[0]) for r in sel}; by={r[1]:r[:] for r in sel}; repl={}
          for rank,n in enumerate(order,86):
              r=by[n][:]; r[0]=str(rank); r[4]='Depth' if rank<=128 else 'Endgame'; r[5]='C'; r[8]=TS; r[9]=f'[[{R}]]'; repl[rank]=r
          out=[]
          for l in txt.splitlines():
              m=re.match(r'^\| (\d+) \|',l)
              if m and int(m.group(1)) in repl: l='| '+' | '.join(repl[int(m.group(1))])+' |'
              out.append(l)
          txt='\n'.join(out)+'\n'; txt=re.sub(r'last_updated: .*',f'last_updated: {TS}',txt,1); txt=re.sub(r'status: .*','status: cross_position_block_4_reviewed',txt,1); board.write_text(txt)
          changed=[]
          for rank,n in enumerate(order,86):
              p=Path(f"vault/02 Players/{n} - {by[n][6]}.md"); s=p.read_text(); s=re.sub(r'(?m)^(current_rank: )\d+',rf'\g<1>{rank}',s,1); s=re.sub(r'(?m)^(last_reviewed: ).*',rf'\g<1>{TS}',s,1); s+=f'\n\n## 2351-AEST cross-position comparison\n\n- Reviewed with overall ranks 91–120 and challengers 86–90 and 121–125.\n- Overall rank: **{old[n]} → {rank}**.\n- Raw expected season points came first, then minutes, role, set pieces, floor/ceiling and positional replacement value.\n- Draft-horizon injury weighting applied; short absences were minor, unknown or multi-month cases material.\n- Evidence and reversal triggers: [[{R}]].\n'; p.write_text(s); changed.append(str(p))
          current=[]
          for l in board.read_text().splitlines():
              if re.match(r'^\| \d+ \|',l): current.append([x.strip() for x in l.strip().strip('|').split('|')])
          for code,pathstr in {'FWD':'vault/04 Positions/Forward.md','MID':'vault/04 Positions/Midfielder.md','DEF':'vault/04 Positions/Defender.md','GKP':'vault/04 Positions/Goalkeeper.md'}.items():
              p=Path(pathstr); s=p.read_text(); lines=[f"{x[0]}. [[02 Players/{x[1]} - {x[6]}|{x[1]}]] — {code}, {x[3]}; {x[4]} / {x[5]}; {x[7]}" for x in current if x[2]==code]; block='<!-- ranked-players:start -->\n## Players by overall rank\n\nPlayers are listed in canonical overall draft rank order.\n\n'+'\n'.join(lines)+f'\n\nSource: [[01 Current/Current Draft Board]] · generated {TS}\n<!-- ranked-players:end -->'; s=re.sub(r'<!-- ranked-players:start -->.*?<!-- ranked-players:end -->',block,s,flags=re.S); s=re.sub(r'last_reviewed: .*',f'last_reviewed: {TS}',s,1); p.write_text(s); changed.append(pathstr)
          pi=Path('/tmp/pi-status').read_text().strip()
          reasons={('Nketiah','Aït-Nouri'):'Nketiah has the scarcer direct scoring route; Aït-Nouri has the stronger attacking-defender floor.',('Calafiori','Garnacho'):'Calafiori has the safer elite-team defensive route; Garnacho owns the higher attacking ceiling.',('Chalobah','Livramento'):'Chalobah has the safer present role, but Livramento’s short calf flag is only a small Draft penalty.',('Livramento','Pickford'):'Livramento’s attacking defender upside narrowly beats a replaceable goalkeeper profile.',('Romero','A.Becker'):'Romero’s outfield replacement value edges a goalkeeper despite Alisson’s stronger raw points floor.'}
          comps=[f"- **{a} vs {b}: {a} first.** {reasons.get((a,b),'Better season-long combination of expected points, minutes, role, floor and Draft replacement value.')} Confidence: medium; reverse for material role, minutes, set-piece or long-term availability change." for a,b in zip(order,order[1:])]
          rp=Path('vault')/f'{R}.md'; rp.parent.mkdir(parents=True,exist_ok=True); rp.write_text(f'''---\ntype: review\nreviewed_at: {TS}\nscope: cross-position ranks 91-120\nchallengers: 86-90 and 121-125\n---\n\n# Cross-position review — overall ranks 91–120\n\n## Changes since prior iteration\n\nInsertion-sorted ranks 91–120 against five players on each boundary using the canonical season-long Draft injury policy.\n\n## API reconciliation\n\nOfficial FPL bootstrap and fixtures fetched successfully; all 40 stable FPL IDs remained present. Premier Injuries returned HTTP **{pi}**; no unsupported return date was adopted.\n\n## Injury decisions\n\nLivramento’s short calf flag received only a small penalty. No available player was demoted merely for a minor current flag.\n\n## Decisive comparisons\n{chr(10).join(comps)}\n\n## Final reviewed order\n\n'''+ '\n'.join(f'{i}. {n}' for i,n in enumerate(order,86)) + '''\n\n## Key trade-offs\n\n- Aït-Nouri and Reijnders rose on attacking upside.\n- Livramento rose because a short absence is a small season-long penalty.\n- Goalkeepers fell behind similarly projected outfield players because replacement value is deeper.\n- Aaronson finished below the reviewed top 120 after direct comparisons with higher-upside outfield options.\n\n## Next block\n\nOverall ranks 121–150 with challengers 116–120 and 151–155.\n\n## Validation\n\nRanks 1–350 remain complete and unique; ranks outside 86–125 retained their occupants.\n''')
          cp=Path('vault')/f'{C}.md'; cp.parent.mkdir(parents=True,exist_ok=True); moves=[f'- {n}: **{old[n]} → {i}**' for i,n in enumerate(order,86) if old[n]!=i]; unchanged=[n for i,n in enumerate(order,86) if old[n]==i]; cp.write_text(f'''---\ntype: changes\nchanged_at: {TS}\nscope: cross-position ranks 91-120\n---\n\n# Cross-position block 4 changes\n\n## Rank changes\n\n{chr(10).join(moves) if moves else '- No material rank changes.'}\n\n## Important no-change decisions\n\n- Unchanged: {', '.join(unchanged) if unchanged else 'None'}.\n- No player outside ranks 86–125 changed global rank.\n- Livramento did not receive a large short-term injury downgrade.\n\n## Next block\n\nOverall ranks 121–150 with challengers 116–120 and 151–155.\n''')
          for f in ['vault/01 Current/Current Watchlist.md','vault/Home.md','vault/Wiki.md']:
              p=Path(f); p.write_text(p.read_text()+f'\n\n<!-- 2351-aest-cross-position-91-120 -->\n- Cross-position ranks 91–120 reviewed with challengers 86–90 and 121–125: [[{R}]] · [[{C}]].\n')
          changed += ['vault/01 Current/Current Draft Board.md',str(rp),str(cp),'vault/01 Current/Current Watchlist.md','vault/Home.md','vault/Wiki.md']
          log=Path('vault/00 Meta/Document Changelog.md'); s=log.read_text(); ev=f'https://fantasy.premierleague.com/api/bootstrap-static/; https://fantasy.premierleague.com/api/fixtures/; https://www.premierinjuries.com/injury-table.php (HTTP {pi}; no unsupported dates adopted); [[{R}]]; [[{C}]]'
          for f in changed+['vault/00 Meta/Document Changelog.md']: s+=f'\n| {TS} | `{f}` | {"created" if f in [str(rp),str(cp)] else "updated"} | Cross-position ranks 91–120 with five-player boundary challengers | [[{R}]] | {ev} |'
          log.write_text(s+'\n')
          PY
          python /tmp/run.py
          python scripts/validate_draft_board.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Review cross-position ranks 91-120"
          git push origin HEAD:codex/fpl-review-20260804-2351-cross-position-91-120
