name: Temporary FPL 0958 review runner
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  generate:
    if: github.head_ref == 'codex/fpl-review-20260802-0958-ranks81-110-recheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fpl-review-20260802-0958-ranks81-110-recheck
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fpl_review_0958.py
      - run: |
          rm scripts/fpl_review_0958.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- vault scripts/fpl_review_0958.py
          git commit -m "Recheck FPL Draft ranks 81-110"
          git push origin HEAD:codex/fpl-review-20260802-0958-ranks81-110-recheck
